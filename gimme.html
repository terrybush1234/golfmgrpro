<title>Gimme Check</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700&family=DM+Mono:wght@400;500&display=swap">

<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
body {
  height: 100dvh; overflow: hidden;
  background: #0e1a0e; color: #dff0df;
  font-family: 'DM Mono', monospace;
  display: flex; flex-direction: column;
}
#cam-wrap { position: relative; flex: 1; min-height: 0; background: #000; overflow: hidden; }
video { width: 100%; height: 100%; object-fit: cover; display: block; }
#overlay { position: absolute; inset: 0; width: 100%; height: 100%; }

#cam-start {
  display: flex; position: absolute; inset: 0;
  flex-direction: column; align-items: center; justify-content: center;
  gap: 20px; background: #0e1a0e; padding: 32px; text-align: center;
}
#cam-start h2 { font-family: 'Barlow Condensed', sans-serif; font-size: 36px; font-weight: 700; }
#cam-start p  { font-family: 'Barlow Condensed', sans-serif; font-size: 20px; color: #7a9a7a; max-width: 280px; line-height: 1.4; }
#cam-start button {
  font-family: 'Barlow Condensed', sans-serif; font-size: 22px; font-weight: 700;
  letter-spacing: 0.07em; text-transform: uppercase;
  background: #e8f54d; color: #0e1a0e;
  border: none; border-radius: 8px; padding: 16px 40px; cursor: pointer;
}
#cam-denied { display: none; position: absolute; inset: 0; flex-direction: column; align-items: center; justify-content: center; gap: 16px; background: #0e1a0e; padding: 32px; text-align: center; }
#cam-denied.show { display: flex; }
#cam-denied h2 { font-family: 'Barlow Condensed', sans-serif; font-size: 28px; font-weight: 600; }
#cam-denied p  { font-family: 'Barlow Condensed', sans-serif; font-size: 18px; color: #7a9a7a; max-width: 280px; line-height: 1.4; }
#cam-denied button { font-family: 'Barlow Condensed', sans-serif; font-size: 18px; font-weight: 700; background: #e8f54d; color: #0e1a0e; border: none; border-radius: 6px; padding: 12px 28px; cursor: pointer; }

/* Debug toggle button */
#dbg-btn {
  position: absolute; top: 8px; right: 8px; z-index: 10;
  font-family: 'Barlow Condensed', sans-serif; font-size: 14px; font-weight: 700;
  background: rgba(14,26,14,0.75); color: #7a9a7a;
  border: 1px solid #2c422c; border-radius: 5px; padding: 5px 10px;
  cursor: pointer; display: none; -webkit-tap-highlight-color: transparent;
}
#dbg-btn.on { color: #e8f54d; border-color: #e8f54d; }

#panel {
  background: #0e1a0e; border-top: 2px solid #1e321e;
  padding: 14px 18px 18px; flex-shrink: 0;
  display: flex; flex-direction: column; gap: 12px;
}
#gimme-row { display: flex; gap: 8px; }
.gimme-btn {
  font-family: 'Barlow Condensed', sans-serif; font-size: 22px; font-weight: 700;
  background: #1c2e1c; color: #7a9a7a;
  border: 2px solid #2c422c; border-radius: 6px;
  padding: 8px 0; cursor: pointer; flex: 1;
  -webkit-tap-highlight-color: transparent;
}
.gimme-btn.active { background: #243824; color: #e8f54d; border-color: #e8f54d; }

#status-row { display: flex; align-items: center; gap: 10px; }
#status-dot { width: 12px; height: 12px; border-radius: 50%; background: #4a6a4a; flex-shrink: 0; }
#status-dot.searching { background: #e8a020; animation: pulse 1s ease-in-out infinite; }
#status-dot.locked    { background: #72d472; }
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }
#status-text { font-family: 'Barlow Condensed', sans-serif; font-size: 22px; color: #7a9a7a; }

#distance-row { display: flex; align-items: baseline; gap: 10px; }
#distance { font-size: 64px; font-weight: 500; line-height: 1; font-variant-numeric: tabular-nums; letter-spacing: -0.03em; color: #e8f54d; }
#verdict { font-family: 'Barlow Condensed', sans-serif; font-size: 22px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; }
#verdict.good { color: #72d472; }
#verdict.bad  { color: #e06060; }
#verdict.none { color: #4a6a4a; }
#tips { font-family: 'Barlow Condensed', sans-serif; font-size: 20px; color: #4a6a4a; line-height: 1.3; }
</style>

<div id="cam-wrap">
  <video id="video" autoplay playsinline muted></video>
  <canvas id="overlay"></canvas>
  <button id="dbg-btn">DEBUG</button>
  <div id="cam-start">
    <h2>Gimme Check</h2>
    <p>Keep the hole on the LEFT and ball on the RIGHT. Distance locks in automatically.</p>
    <button id="btn-start">Start Camera</button>
  </div>
  <div id="cam-denied">
    <h2>Camera blocked</h2>
    <p>Tap the lock icon in the address bar, set Camera to Allow, then reload.</p>
    <button onclick="location.reload()">Reload</button>
  </div>
</div>

<div id="panel">
  <div>
    <div style="font-family:'Barlow Condensed',sans-serif;font-size:16px;font-weight:600;letter-spacing:0.12em;text-transform:uppercase;color:#7a9a7a;margin-bottom:6px;">Gimme distance</div>
    <div id="gimme-row">
      <button class="gimme-btn" data-in="12">12"</button>
      <button class="gimme-btn" data-in="18">18"</button>
      <button class="gimme-btn active" data-in="24">24"</button>
      <button class="gimme-btn" data-in="36">36"</button>
    </div>
  </div>
  <div id="status-row">
    <div id="status-dot"></div>
    <div id="status-text">Start camera to begin</div>
  </div>
  <div id="distance-row">
    <div id="distance">—</div>
    <div id="verdict" class="none"></div>
  </div>
  <div id="tips">Calibrate background first. Keep HOLE LEFT, BALL RIGHT</div>
  <div style="display:flex;gap:8px;">
    <button id="cal-btn" style="font-family:'Barlow Condensed',sans-serif;font-size:22px;font-weight:700;background:#1c2e1c;color:#7a9a7a;border:2px solid #2c422c;border-radius:6px;padding:10px 0;cursor:pointer;flex:1;-webkit-tap-highlight-color:transparent;">Calibrate</button>
    <button id="reset-btn" style="font-family:'Barlow Condensed',sans-serif;font-size:22px;font-weight:700;background:#1c2e1c;color:#7a9a7a;border:2px solid #2c422c;border-radius:6px;padding:10px 0;cursor:pointer;flex:1;-webkit-tap-highlight-color:transparent;">Measure Again</button>
  </div>
</div>

<script>
// ── Known sizes ───────────────────────────────────────────
const HOLE_DIA_IN = 4.25;
const BALL_DIA_IN = 1.68;
// Hole is ~2.53× the diameter of a ball.
// We use this ratio to tell them apart when both appear as bright circles.
const SIZE_RATIO  = HOLE_DIA_IN / BALL_DIA_IN; // ~2.53

const video      = document.getElementById('video');
const overlay    = document.getElementById('overlay');
const ctx        = overlay.getContext('2d');
const statusDot  = document.getElementById('status-dot');
const statusText = document.getElementById('status-text');
const distEl     = document.getElementById('distance');
const verdEl     = document.getElementById('verdict');
const tips       = document.getElementById('tips');
const dbgBtn     = document.getElementById('dbg-btn');

let gimmeIn = 24, running = false, showDebug = false;
let bgR = 70, bgG = 110, bgB = 50, bgCalibrated = false;

// Lock state
let locked = false;
let lockedHole = null, lockedBall = null, lockedInches = 0;
let confirmCount = 0;
const CONFIRM_FRAMES = 5;
let lastHole = null, lastBall = null;

// Smoothed display positions (exponential moving average)
const SMOOTH = 0.25; // lower = smoother but slower
let smHole = null, smBall = null;
function smoothPt(sm, det) {
  if (!sm || !det) return det ? {...det} : null;
  return {
    x: sm.x*(1-SMOOTH) + det.x*SMOOTH,
    y: sm.y*(1-SMOOTH) + det.y*SMOOTH,
    r: sm.r*(1-SMOOTH) + det.r*SMOOTH
  };
}

const W = 160, H = 120;
const off = document.createElement('canvas');
off.width = W; off.height = H;
const offCtx = off.getContext('2d', { willReadFrequently: true });

// Debug pixel canvas
const dbgCv = document.createElement('canvas');
dbgCv.width = W; dbgCv.height = H;
const dbgCtx = dbgCv.getContext('2d');

document.querySelectorAll('.gimme-btn').forEach(b => {
  b.addEventListener('click', () => {
    document.querySelectorAll('.gimme-btn').forEach(x => x.classList.remove('active'));
    b.classList.add('active');
    gimmeIn = parseInt(b.dataset.in);
  });
});

document.getElementById('reset-btn').addEventListener('click', () => {
  locked=false; lockedHole=null; lockedBall=null; confirmCount=0; lastHole=null; lastBall=null;
  distEl.textContent='—'; verdEl.textContent=''; verdEl.className='none';
  statusDot.className='searching'; statusText.textContent='Looking for hole and ball…';
  tips.style.display='';
});

document.getElementById('cal-btn').addEventListener('click', () => {
  if (!running || !video.videoWidth) return;
  // Sample the center region of the frame as background color
  const { sx, sy, sw, sh } = getVideoCrop();
  offCtx.drawImage(video, sx, sy, sw, sh, 0, 0, W, H);
  const data = offCtx.getImageData(0, 0, W, H).data;
  // Average the middle 50% of the frame (avoids edges where hole/ball might be)
  const x0=Math.floor(W*0.25), x1=Math.floor(W*0.75);
  const y0=Math.floor(H*0.25), y1=Math.floor(H*0.50); // upper-mid only (scan zone)
  let sr=0,sg=0,sb=0,sn=0;
  for (let y=y0; y<y1; y++) for (let x=x0; x<x1; x++) {
    const i=(y*W+x)*4; sr+=data[i]; sg+=data[i+1]; sb+=data[i+2]; sn++;
  }
  bgR=sr/sn; bgG=sg/sn; bgB=sb/sn; bgCalibrated=true;
  const btn = document.getElementById('cal-btn');
  btn.textContent='✓ Set'; btn.style.color='#72d472'; btn.style.borderColor='#72d472';
  setTimeout(()=>{ btn.textContent='Calibrate'; btn.style.color=''; btn.style.borderColor=''; }, 1500);
});

dbgBtn.addEventListener('click', () => {
  showDebug = !showDebug;
  dbgBtn.classList.toggle('on', showDebug);
  dbgBtn.textContent = showDebug ? 'DEBUG ON' : 'DEBUG';
});

document.getElementById('btn-start').addEventListener('click', async () => {
  document.getElementById('cam-start').style.display = 'none';
  try {
    const stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: { ideal: 'environment' }, width: { ideal: 1280 } }
    });
    video.srcObject = stream;
    video.addEventListener('loadedmetadata', () => {
      syncCanvas(); running = true; dbgBtn.style.display = 'block'; loop();
    });
  } catch { document.getElementById('cam-denied').classList.add('show'); }
});

window.addEventListener('resize', syncCanvas);
function syncCanvas() {
  const r = overlay.parentElement.getBoundingClientRect();
  overlay.width = r.width; overlay.height = r.height;
}

// ── Cluster pixels: prune outliers, check circularity, return centroid ────
function clusterPx(pixels, minCount, minRad, maxRadFrac) {
  if (pixels.length < minCount) return null;
  let sx=0, sy=0;
  for (const [x,y] of pixels) { sx+=x; sy+=y; }
  let cx=sx/pixels.length, cy=sy/pixels.length, pts=pixels;
  for (let i=0; i<2; i++) {
    const re = Math.sqrt(pts.length / Math.PI);
    pts = pts.filter(([x,y]) => Math.hypot(x-cx,y-cy) < re*2.5);
    if (pts.length < minCount) return null;
    sx=0; sy=0; for (const [x,y] of pts) { sx+=x; sy+=y; }
    cx=sx/pts.length; cy=sy/pts.length;
  }
  const rad = Math.sqrt(pts.length / Math.PI);
  if (rad < minRad || rad > W * maxRadFrac) return null;

  // Fill density: real circles fill their area. Shoes/irregular blobs don't.
  // pixels / (π × r²) should be > 0.30 for a genuine circular object.
  const area = Math.PI * rad * rad;
  const density = pts.length / area;
  if (density < 0.30) return null; // sparse = not a real circle

  // Bounding box aspect ratio: reject elongated shapes
  let minX=W,maxX=0,minY=H,maxY=0;
  for (const [x,y] of pts) {
    if (x<minX) minX=x; if (x>maxX) maxX=x;
    if (y<minY) minY=y; if (y>maxY) maxY=y;
  }
  const bw=maxX-minX+1, bh=maxY-minY+1;
  if (Math.min(bw,bh)/Math.max(bw,bh) < 0.45) return null;

  return { cx, cy, rad, n: pts.length };
}

// ── Match object-fit:cover crop so canvas coords align with visible video ──
function getVideoCrop() {
  const vW = video.videoWidth, vH = video.videoHeight;
  const dW = overlay.width,    dH = overlay.height;
  if (!vW || !dW) return { sx:0, sy:0, sw:vW, sh:vH };
  const vAR = vW/vH, dAR = dW/dH;
  let sx, sy, sw, sh;
  if (vAR > dAR) { sh=vH; sw=vH*dAR; sx=(vW-sw)/2; sy=0; }
  else           { sw=vW; sh=vW/dAR; sx=0; sy=(vH-sh)/2; }
  return { sx, sy, sw, sh };
}

// ── Analysis ──────────────────────────────────────────────────────────────
function analyze() {
  const { sx, sy, sw, sh } = getVideoCrop();
  offCtx.drawImage(video, sx, sy, sw, sh, 0, 0, W, H);
  const data = offCtx.getImageData(0, 0, W, H).data;

  // Use calibrated background color, or auto-sample green grass if not calibrated
  let grassR = bgR, grassG = bgG, grassB = bgB;
  if (!bgCalibrated) {
    let gR=0, gG=0, gB=0, gN=0;
    for (let i=0; i<data.length; i+=4) {
      const r=data[i], g=data[i+1], b=data[i+2];
      if (g > r*1.05 && g > b*1.05 && g > 30 && g < 220) { gR+=r; gG+=g; gB+=b; gN++; }
    }
    if (gN > 80) { grassR=gR/gN; grassG=gG/gN; grassB=gB/gN; }
  }

  // Only analyze the top 65% of the frame — feet are always at the bottom
  const SCAN_H = Math.floor(H * 0.65);

  // Pass 2: find non-grass pixels above shadow level (not shadow, not grass)
  const nonGrassPx = [];
  const dbgImg = showDebug ? dbgCtx.createImageData(W, H) : null;

  for (let y=0; y<SCAN_H; y++) {
    for (let x=0; x<W; x++) {
      const i = (y*W+x)*4;
      const r=data[i], g=data[i+1], b=data[i+2];
      const luma = 0.299*r + 0.587*g + 0.114*b;
      const dr=r-grassR, dg=g-grassG, db=b-grassB;
      const colorDist = Math.sqrt(dr*dr + dg*dg + db*db);

      // Not grass, not a shadow (luma > 60 excludes very dark areas AND most shadows)
      const isCandidate = colorDist > 50 && luma > 60;

      if (isCandidate) nonGrassPx.push([x, y]);

      if (showDebug && dbgImg) {
        const di = i;
        if (isCandidate) {
          dbgImg.data[di]=255; dbgImg.data[di+1]=220; dbgImg.data[di+2]=0; dbgImg.data[di+3]=160;
        } else {
          dbgImg.data[di+3]=0;
        }
      }
    }
  }

  if (showDebug && dbgImg) {
    dbgCtx.putImageData(dbgImg, 0, 0);
  }

  // Cluster all non-grass candidates
  const cluster = clusterPx(nonGrassPx, 5, 2, 0.5);
  if (!cluster) return { hole: null, ball: null, clusters: [] };

  // Split into two groups: pixels close to cluster center vs farther out
  // The hole (larger) and ball (smaller) may form two sub-clusters.
  // Strategy: find largest cluster first (hole candidate), then look for
  // a second cluster that is clearly separated from it.

  const sx2 = overlay.width/W, sy2 = overlay.height/H, sc=(sx2+sy2)/2;

  // Find up to 2 distinct clusters by splitting non-grass pixels
  const clusters = findTwoClusters(nonGrassPx, gimmeIn);
  let hole = null, ball = null;

  if (clusters.length === 2) {
    // Assign by position: hole is always the LEFT object, ball is always RIGHT.
    // User positions camera so hole is on the left side of the frame.
    const [left, right] = clusters[0].cx <= clusters[1].cx ? [clusters[0], clusters[1]] : [clusters[1], clusters[0]];
    // Still require left object is larger (hole > ball) to reject two same-size objects
    if (left.rad >= right.rad * 0.8) { // hole should be >= ball size
      hole = { x: left.cx*sx2,  y: left.cy*sy2,  r: Math.max(10, left.rad*sc) };
      ball = { x: right.cx*sx2, y: right.cy*sy2, r: Math.max(6,  right.rad*sc) };
    } else {
      hole = { x: left.cx*sx2, y: left.cy*sy2, r: Math.max(10, left.rad*sc) };
    }
  } else if (clusters.length === 1) {
    const c = clusters[0];
    hole = { x: c.cx*sx2, y: c.cy*sy2, r: Math.max(10, c.rad*sc) };
  }

  return { hole, ball };
}

// Score a cluster: higher = more circle-like (dense + compact)
function scoreCluster(c) { return c ? c.n / (Math.PI * c.rad * c.rad) : 0; }

// Find best two circular clusters by scanning spatially distinct regions
function findTwoClusters(pixels, maxGimmeInches) {
  if (pixels.length < 5) return [];

  // Find best cluster overall (hole candidate)
  const c1 = clusterPx(pixels, 5, 2, 0.45);
  if (!c1) return [];

  // Peel off c1 pixels generously so ball search isn't contaminated by hole edge
  const re1 = Math.sqrt(c1.n / Math.PI);
  const rest = pixels.filter(([x,y]) => Math.hypot(x-c1.cx,y-c1.cy) > re1*3.0);
  if (rest.length < 4) return [c1];

  // Ball must be smaller than hole — cap its max radius to just below c1's radius
  const maxBallRadFrac = Math.min(0.35, (c1.rad * 0.85) / W);
  const c2 = clusterPx(rest, 4, 1, maxBallRadFrac);
  if (!c2) return [c1];

  // The two clusters must be spatially separated — centers farther apart than sum of radii
  const dist = Math.hypot(c2.cx - c1.cx, c2.cy - c1.cy);
  if (dist < c1.rad + c2.rad) return [c1]; // overlapping = same object

  // Physics constraint: ball can't be beyond the selected gimme distance.
  const maxGimmePx = (maxGimmeInches / HOLE_DIA_IN) * (c1.rad * 2);
  if (dist > maxGimmePx) return [c1]; // too far away to be a valid ball

  return [c1, c2];
}

// ── Draw helpers ──────────────────────────────────────────────────────────
function ring(cx, cy, r, col) {
  ctx.beginPath(); ctx.arc(cx,cy,r,0,Math.PI*2);
  ctx.strokeStyle=col; ctx.lineWidth=2.5; ctx.stroke();
}
function cross(cx, cy, s, col) {
  ctx.strokeStyle=col; ctx.lineWidth=2;
  ctx.beginPath();
  ctx.moveTo(cx-s,cy); ctx.lineTo(cx+s,cy);
  ctx.moveTo(cx,cy-s); ctx.lineTo(cx,cy+s);
  ctx.stroke();
}
function dashedLine(ax,ay,bx,by) {
  ctx.beginPath(); ctx.moveTo(ax,ay); ctx.lineTo(bx,by);
  ctx.strokeStyle='#72d472'; ctx.lineWidth=2.5;
  ctx.setLineDash([8,5]); ctx.stroke(); ctx.setLineDash([]);
}
function badge(txt,x,y,col) {
  ctx.font='bold 13px "DM Mono",monospace';
  ctx.textAlign='center'; ctx.textBaseline='middle';
  const w=ctx.measureText(txt).width+12;
  ctx.fillStyle='rgba(14,26,14,0.85)';
  ctx.beginPath(); ctx.roundRect(x-w/2,y-11,w,22,3); ctx.fill();
  ctx.fillStyle=col; ctx.fillText(txt,x,y);
}

// ── Render loop ───────────────────────────────────────────────────────────
let frameCount=0;
function loop() {
  if (!running) return;
  requestAnimationFrame(loop);
  if (++frameCount % 3 !== 0 || !video.videoWidth) return;

  ctx.clearRect(0,0,overlay.width,overlay.height);

  // Draw scan zone guide (top 65% of frame)
  const zoneH = overlay.height * 0.65;
  ctx.strokeStyle = 'rgba(232,245,77,0.25)';
  ctx.lineWidth = 1.5;
  ctx.setLineDash([6,4]);
  ctx.strokeRect(8, 8, overlay.width-16, zoneH-16);
  ctx.setLineDash([]);
  // Subtle label
  ctx.font = '11px "DM Mono",monospace';
  ctx.fillStyle = 'rgba(232,245,77,0.35)';
  ctx.textAlign = 'center'; ctx.textBaseline = 'top';
  ctx.fillText('aim hole + ball here', overlay.width/2, 12);

  // Draw debug pixel layer first (behind circles)
  if (showDebug) {
    ctx.drawImage(dbgCv, 0, 0, overlay.width, overlay.height);
  }

  const { hole, ball } = analyze();

  if (hole) {
    ring(hole.x,hole.y,hole.r,'rgba(232,245,77,0.85)');
    cross(hole.x,hole.y,7,'#e8f54d');
    badge('HOLE',hole.x,hole.y-hole.r-14,'#e8f54d');
  }
  if (ball) {
    ring(ball.x,ball.y,ball.r,'rgba(114,212,114,0.85)');
    cross(ball.x,ball.y,6,'#72d472');
    badge('BALL',ball.x,ball.y-ball.r-14,'#72d472');
  }

  if (locked) {
    // Frozen — draw saved detection, don't re-analyze
    ring(lockedHole.x,lockedHole.y,lockedHole.r,'rgba(232,245,77,0.85)');
    cross(lockedHole.x,lockedHole.y,7,'#e8f54d');
    badge('HOLE',lockedHole.x,lockedHole.y-lockedHole.r-14,'#e8f54d');
    ring(lockedBall.x,lockedBall.y,lockedBall.r,'rgba(114,212,114,0.85)');
    cross(lockedBall.x,lockedBall.y,6,'#72d472');
    badge('BALL',lockedBall.x,lockedBall.y-lockedBall.r-14,'#72d472');
    dashedLine(lockedHole.x,lockedHole.y,lockedBall.x,lockedBall.y);
    badge(lockedInches.toFixed(1)+'"',(lockedHole.x+lockedBall.x)/2,(lockedHole.y+lockedBall.y)/2-14,'#72d472');
    return;
  }

  if (hole && ball) {
    // Smooth positions — circles glide instead of jumping
    smHole = smoothPt(smHole, hole);
    smBall = smoothPt(smBall, ball);

    const pxPerIn = (smHole.r*2) / HOLE_DIA_IN;
    const inches  = Math.hypot(smBall.x-smHole.x, smBall.y-smHole.y) / pxPerIn;

    // Stability check on raw (not smoothed) positions
    const stableHole = lastHole && Math.hypot(hole.x-lastHole.x, hole.y-lastHole.y) < hole.r*0.4;
    const stableBall = lastBall && Math.hypot(ball.x-lastBall.x, ball.y-lastBall.y) < ball.r*0.8;
    if (stableHole && stableBall) confirmCount++;
    else confirmCount = 0;
    lastHole = hole; lastBall = ball;

    // Draw smoothed positions
    ring(smHole.x,smHole.y,smHole.r,'rgba(232,245,77,0.85)');
    cross(smHole.x,smHole.y,7,'#e8f54d');
    badge('HOLE',smHole.x,smHole.y-smHole.r-14,'#e8f54d');
    ring(smBall.x,smBall.y,smBall.r,'rgba(114,212,114,0.85)');
    cross(smBall.x,smBall.y,6,'#72d472');
    badge('BALL',smBall.x,smBall.y-smBall.r-14,'#72d472');
    dashedLine(smHole.x,smHole.y,smBall.x,smBall.y);
    badge(inches.toFixed(1)+'"',(smHole.x+smBall.x)/2,(smHole.y+smBall.y)/2-14,'#72d472');

    if (confirmCount >= CONFIRM_FRAMES) {
      // Lock it
      locked = true;
      lockedHole = hole; lockedBall = ball; lockedInches = inches;
      distEl.textContent = inches.toFixed(1)+' in';
      verdEl.textContent = inches<=gimmeIn ? 'Gimme ✓' : 'Putt it';
      verdEl.className   = inches<=gimmeIn ? 'good' : 'bad';
      statusDot.className='locked';
      statusText.textContent='Locked — tap Measure Again to re-scan';
      tips.style.display='none';
    } else {
      distEl.textContent = inches.toFixed(1)+' in';
      verdEl.textContent = inches<=gimmeIn ? 'Gimme ✓' : 'Putt it';
      verdEl.className   = inches<=gimmeIn ? 'good' : 'bad';
      statusDot.className='searching';
      statusText.textContent=`Confirming… hold still`;
      tips.style.display='none';
    }
  } else {
    confirmCount=0; lastHole=null; lastBall=null;
    distEl.textContent='—'; verdEl.textContent=''; verdEl.className='none';
    statusDot.className='searching'; tips.style.display='';
    if (!hole&&!ball)  statusText.textContent='Looking for hole and ball…';
    else if (!hole)    statusText.textContent='Ball found — looking for hole…';
    else               statusText.textContent='Hole found — looking for ball…';
  }
}
</script>
