<title>Gimme Check</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700&family=DM+Mono:wght@400;500&display=swap">

<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
body {
  height: 100dvh; overflow: hidden;
  background: #0e1a0e; color: #dff0df;
  font-family: 'DM Mono', monospace;
  display: flex; flex-direction: column;
  user-select: none; -webkit-user-select: none;
}
#cam-wrap { position: relative; flex: 1; min-height: 0; background: #000; overflow: hidden; }
video { width: 100%; height: 100%; object-fit: cover; display: block; }
#overlay { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; cursor: crosshair; }

#cam-start {
  display: flex; position: absolute; inset: 0;
  flex-direction: column; align-items: center; justify-content: center;
  gap: 20px; background: #0e1a0e; padding: 32px; text-align: center;
}
#cam-start h2 { font-family: 'Barlow Condensed', sans-serif; font-size: 36px; font-weight: 700; }
#cam-start p  { font-family: 'Barlow Condensed', sans-serif; font-size: 20px; color: #7a9a7a; max-width: 300px; line-height: 1.5; }
#cam-start button {
  font-family: 'Barlow Condensed', sans-serif; font-size: 24px; font-weight: 700;
  letter-spacing: 0.07em; text-transform: uppercase;
  background: #e8f54d; color: #0e1a0e;
  border: none; border-radius: 8px; padding: 16px 40px; cursor: pointer;
}
#cam-denied { display: none; position: absolute; inset: 0; flex-direction: column; align-items: center; justify-content: center; gap: 16px; background: #0e1a0e; padding: 32px; text-align: center; }
#cam-denied.show { display: flex; }
#cam-denied h2 { font-family: 'Barlow Condensed', sans-serif; font-size: 28px; }
#cam-denied p  { font-family: 'Barlow Condensed', sans-serif; font-size: 18px; color: #7a9a7a; max-width: 280px; line-height: 1.4; }
#cam-denied button { font-family: 'Barlow Condensed', sans-serif; font-size: 18px; font-weight: 700; background: #e8f54d; color: #0e1a0e; border: none; border-radius: 6px; padding: 12px 28px; cursor: pointer; }

/* Tap hint pulse ring */
@keyframes tapPulse {
  0%   { transform: translate(-50%,-50%) scale(0.6); opacity: 0.9; }
  100% { transform: translate(-50%,-50%) scale(2.2); opacity: 0; }
}
.tap-pulse {
  position: absolute; width: 56px; height: 56px; border-radius: 50%;
  border: 3px solid #e8f54d; pointer-events: none;
  animation: tapPulse 0.5s ease-out forwards;
}
.tap-pulse.ball { border-color: #72d472; }

#panel {
  background: #0e1a0e; border-top: 2px solid #1e321e;
  padding: 14px 18px 18px; flex-shrink: 0;
  display: flex; flex-direction: column; gap: 12px;
}
#gimme-row { display: flex; gap: 8px; }
.gimme-btn {
  font-family: 'Barlow Condensed', sans-serif; font-size: 22px; font-weight: 700;
  background: #1c2e1c; color: #7a9a7a;
  border: 2px solid #2c422c; border-radius: 6px;
  padding: 8px 0; cursor: pointer; flex: 1;
  -webkit-tap-highlight-color: transparent;
}
.gimme-btn.active { background: #243824; color: #e8f54d; border-color: #e8f54d; }

#status-text { font-family: 'Barlow Condensed', sans-serif; font-size: 22px; color: #7a9a7a; }
#distance-row { display: flex; align-items: baseline; gap: 10px; }
#distance { font-size: 64px; font-weight: 500; line-height: 1; font-variant-numeric: tabular-nums; letter-spacing: -0.03em; color: #e8f54d; }
#verdict { font-family: 'Barlow Condensed', sans-serif; font-size: 26px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; }
#verdict.good { color: #72d472; }
#verdict.bad  { color: #e06060; }
#verdict.none { color: #4a6a4a; }
#tips { font-family: 'Barlow Condensed', sans-serif; font-size: 20px; color: #7a9a7a; line-height: 1.35; }
#reset-btn {
  font-family: 'Barlow Condensed', sans-serif; font-size: 22px; font-weight: 700;
  background: #1c2e1c; color: #7a9a7a; border: 2px solid #2c422c;
  border-radius: 6px; padding: 10px 0; cursor: pointer; width: 100%;
  -webkit-tap-highlight-color: transparent;
}
</style>

<div id="cam-wrap">
  <video id="video" autoplay playsinline muted></video>
  <canvas id="overlay"></canvas>
  <div id="cam-start">
    <h2>Gimme Check</h2>
    <p>Tap the <span style="color:#e8f54d">hole</span>, then tap the <span style="color:#72d472">ball</span>. The app measures the edge of each and calculates the distance.</p>
    <button id="btn-start">Start Camera</button>
  </div>
  <div id="cam-denied">
    <h2>Camera blocked</h2>
    <p>Tap the lock icon in the address bar, set Camera to Allow, then reload.</p>
    <button onclick="location.reload()">Reload</button>
  </div>
</div>

<div id="panel">
  <div>
    <div style="font-family:'Barlow Condensed',sans-serif;font-size:16px;font-weight:600;letter-spacing:0.12em;text-transform:uppercase;color:#7a9a7a;margin-bottom:6px;">Gimme distance</div>
    <div id="gimme-row">
      <button class="gimme-btn" data-in="12">12"</button>
      <button class="gimme-btn" data-in="18">18"</button>
      <button class="gimme-btn active" data-in="24">24"</button>
      <button class="gimme-btn" data-in="36">36"</button>
    </div>
  </div>
  <div id="status-text">Start camera to begin</div>
  <div id="distance-row">
    <div id="distance">—</div>
    <div id="verdict" class="none"></div>
  </div>
  <div id="tips"></div>
  <button id="reset-btn">Measure Again</button>
</div>

<script>
const HOLE_DIA_IN = 4.25;

const video   = document.getElementById('video');
const overlay = document.getElementById('overlay');
const ctx     = overlay.getContext('2d');
const statusTxt = document.getElementById('status-text');
const distEl    = document.getElementById('distance');
const verdEl    = document.getElementById('verdict');
const tips      = document.getElementById('tips');

let gimmeIn = 24, running = false;

// State: 'hole' → waiting for hole tap, 'ball' → waiting for ball tap, 'done'
let state = 'hole';
let hole = null; // { x, y, r }  — screen coords
let ball = null;

// Offscreen canvas for pixel sampling
const W = 320, H = 240;
const off = document.createElement('canvas');
off.width = W; off.height = H;
const offCtx = off.getContext('2d', { willReadFrequently: true });

// ── Sync canvas size ──────────────────────────────────────────────────────
function syncCanvas() {
  const rect = overlay.parentElement.getBoundingClientRect();
  overlay.width  = rect.width;
  overlay.height = rect.height;
}
window.addEventListener('resize', () => { syncCanvas(); redraw(); });

// ── Video crop for object-fit:cover alignment ─────────────────────────────
function getVideoCrop() {
  const vW = video.videoWidth, vH = video.videoHeight;
  const dW = overlay.width,    dH = overlay.height;
  if (!vW || !dW) return { sx:0, sy:0, sw:vW||1, sh:vH||1 };
  const vAR = vW/vH, dAR = dW/dH;
  let sx, sy, sw, sh;
  if (vAR > dAR) { sh=vH; sw=vH*dAR; sx=(vW-sw)/2; sy=0; }
  else           { sw=vW; sh=vW/dAR; sx=0; sy=(vH-sh)/2; }
  return { sx, sy, sw, sh };
}

// ── Sample pixel at screen coordinate ────────────────────────────────────
function sampleAt(screenX, screenY) {
  const { sx, sy, sw, sh } = getVideoCrop();
  offCtx.drawImage(video, sx, sy, sw, sh, 0, 0, W, H);
  const px = Math.round((screenX / overlay.width)  * W);
  const py = Math.round((screenY / overlay.height) * H);
  const cx = Math.max(0, Math.min(W-1, px));
  const cy = Math.max(0, Math.min(H-1, py));
  // Average a 3×3 block for stability
  let r=0,g=0,b=0,n=0;
  const data = offCtx.getImageData(0, 0, W, H).data;
  for (let dy=-1; dy<=1; dy++) for (let dx=-1; dx<=1; dx++) {
    const nx=cx+dx, ny=cy+dy;
    if (nx<0||nx>=W||ny<0||ny>=H) continue;
    const i=(ny*W+nx)*4;
    r+=data[i]; g+=data[i+1]; b+=data[i+2]; n++;
  }
  return { r:r/n, g:g/n, b:b/n, data, W, H };
}

// ── Find edge radius from tap point via color-transition rays ─────────────
function detectRadius(screenX, screenY, minPx, maxPx) {
  const { r:cr, g:cg, b:cb, data } = sampleAt(screenX, screenY);
  const { sx, sy, sw, sh } = getVideoCrop();

  // Map screen coords to offscreen canvas coords
  const ox = (screenX / overlay.width)  * W;
  const oy = (screenY / overlay.height) * H;

  // Maximum ray length in offscreen-canvas pixels
  const maxOffPx = (maxPx / overlay.width) * W;
  const minOffPx = (minPx / overlay.width) * W;

  const RAYS = 16;
  const radii = [];

  for (let i = 0; i < RAYS; i++) {
    const angle = (i / RAYS) * Math.PI * 2;
    const dx = Math.cos(angle), dy = Math.sin(angle);
    let edgeDist = maxOffPx; // default to max if no edge found

    for (let d = 2; d <= maxOffPx; d += 0.5) {
      const nx = Math.round(ox + dx * d);
      const ny = Math.round(oy + dy * d);
      if (nx < 0 || nx >= W || ny < 0 || ny >= H) { edgeDist = d; break; }
      const idx = (ny * W + nx) * 4;
      const pr = data[idx], pg = data[idx+1], pb = data[idx+2];
      const dist = Math.sqrt((pr-cr)**2 + (pg-cg)**2 + (pb-cb)**2);
      if (dist > 45) { edgeDist = d; break; }
    }
    radii.push(edgeDist);
  }

  // Median of ray lengths → robust against outlier rays
  radii.sort((a,b) => a-b);
  const medOff = radii[Math.floor(RAYS / 2)];

  // Convert offscreen-canvas pixels back to screen pixels
  const screenRad = (medOff / W) * overlay.width;
  return Math.max(minPx, Math.min(maxPx, screenRad));
}

// ── Tap handling ──────────────────────────────────────────────────────────
let tapMoved = false, tapStartX = 0, tapStartY = 0;

overlay.addEventListener('touchstart', e => {
  e.preventDefault();
  const t = e.changedTouches[0];
  tapStartX = t.clientX; tapStartY = t.clientY; tapMoved = false;
}, { passive: false });

overlay.addEventListener('touchmove', e => {
  e.preventDefault();
  const t = e.changedTouches[0];
  if (Math.hypot(t.clientX - tapStartX, t.clientY - tapStartY) > 10) tapMoved = true;
}, { passive: false });

overlay.addEventListener('touchend', e => {
  e.preventDefault();
  if (tapMoved) return;
  const t = e.changedTouches[0];
  handleTap(t.clientX, t.clientY);
}, { passive: false });

// Desktop mouse support
overlay.addEventListener('click', e => {
  handleTap(e.clientX, e.clientY);
});

function handleTap(x, y) {
  if (!running || state === 'done') return;

  // Pulse animation
  const pulse = document.createElement('div');
  pulse.className = 'tap-pulse' + (state === 'ball' ? ' ball' : '');
  pulse.style.left = x + 'px'; pulse.style.top = y + 'px';
  overlay.parentElement.appendChild(pulse);
  setTimeout(() => pulse.remove(), 520);

  if (state === 'hole') {
    const r = detectRadius(x, y, 16, overlay.width * 0.30);
    hole = { x, y, r };
    state = 'ball';
    statusTxt.textContent = 'Now tap the ball';
    tips.textContent = '';

  } else if (state === 'ball') {
    const r = detectRadius(x, y, 8, overlay.width * 0.18);
    ball = { x, y, r };
    state = 'done';
    showResult();
  }

  redraw();
}

// ── Show result ───────────────────────────────────────────────────────────
function showResult() {
  const pxPerIn = (hole.r * 2) / HOLE_DIA_IN;
  const inches  = Math.hypot(ball.x - hole.x, ball.y - hole.y) / pxPerIn;
  distEl.textContent = inches.toFixed(1) + ' in';
  const isGimme = inches <= gimmeIn;
  verdEl.textContent = isGimme ? 'Gimme ✓' : 'Putt it';
  verdEl.className   = isGimme ? 'good' : 'bad';
  statusTxt.textContent = `${inches.toFixed(1)}" from hole`;
  tips.textContent = 'Tap Measure Again to re-measure';
}

// ── Draw ──────────────────────────────────────────────────────────────────
function drawRing(obj, color, label) {
  // Glow
  ctx.beginPath(); ctx.arc(obj.x, obj.y, obj.r + 5, 0, Math.PI*2);
  ctx.strokeStyle = color + '35'; ctx.lineWidth = 10; ctx.stroke();
  // Ring
  ctx.beginPath(); ctx.arc(obj.x, obj.y, obj.r, 0, Math.PI*2);
  ctx.strokeStyle = color; ctx.lineWidth = 3; ctx.stroke();
  // Crosshair
  ctx.strokeStyle = color; ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(obj.x-12, obj.y); ctx.lineTo(obj.x+12, obj.y);
  ctx.moveTo(obj.x, obj.y-12); ctx.lineTo(obj.x, obj.y+12);
  ctx.stroke();
  // Label
  ctx.font = 'bold 14px "DM Mono",monospace';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  const lw = ctx.measureText(label).width + 14;
  const ly = obj.y - obj.r - 18;
  ctx.fillStyle = 'rgba(14,26,14,0.88)';
  ctx.beginPath(); ctx.roundRect(obj.x - lw/2, ly-12, lw, 24, 4); ctx.fill();
  ctx.fillStyle = color; ctx.fillText(label, obj.x, ly);
}

function redraw() {
  ctx.clearRect(0, 0, overlay.width, overlay.height);
  if (!running) return;

  if (hole) drawRing(hole, '#e8f54d', 'HOLE');

  if (hole && ball) {
    ctx.beginPath();
    ctx.moveTo(hole.x, hole.y); ctx.lineTo(ball.x, ball.y);
    ctx.strokeStyle = 'rgba(255,255,255,0.40)'; ctx.lineWidth = 2;
    ctx.setLineDash([8,5]); ctx.stroke(); ctx.setLineDash([]);
  }

  if (ball) drawRing(ball, '#72d472', 'BALL');

  // Crosshair hint when waiting for tap
  if (state === 'hole' || state === 'ball') {
    const col = state === 'hole' ? '#e8f54d' : '#72d472';
    const cx = overlay.width / 2, cy = overlay.height * 0.45;
    ctx.strokeStyle = col + '55'; ctx.lineWidth = 1.5;
    ctx.setLineDash([4,4]);
    ctx.beginPath(); ctx.moveTo(cx-20,cy); ctx.lineTo(cx+20,cy); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(cx,cy-20); ctx.lineTo(cx,cy+20); ctx.stroke();
    ctx.setLineDash([]);
  }
}

// ── Reset ─────────────────────────────────────────────────────────────────
function reset() {
  state = 'hole'; hole = null; ball = null;
  distEl.textContent = '—'; verdEl.textContent = ''; verdEl.className = 'none';
  statusTxt.textContent = 'Tap the hole';
  tips.textContent = 'The app detects its edge automatically';
  redraw();
}

document.getElementById('reset-btn').addEventListener('click', reset);

document.querySelectorAll('.gimme-btn').forEach(b => {
  b.addEventListener('click', () => {
    document.querySelectorAll('.gimme-btn').forEach(x => x.classList.remove('active'));
    b.classList.add('active');
    gimmeIn = parseInt(b.dataset.in);
    if (state === 'done') showResult();
    redraw();
  });
});

document.getElementById('btn-start').addEventListener('click', async () => {
  document.getElementById('cam-start').style.display = 'none';
  try {
    const stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: { ideal: 'environment' }, width: { ideal: 1280 } }
    });
    video.srcObject = stream;
    video.addEventListener('loadedmetadata', () => {
      syncCanvas(); running = true; reset();
    });
  } catch { document.getElementById('cam-denied').classList.add('show'); }
});
</script>
