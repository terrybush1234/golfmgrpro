<title>Gimme Check</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700&family=DM+Mono:wght@400;500&display=swap">

<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
body {
  height: 100dvh; overflow: hidden;
  background: #0e1a0e; color: #dff0df;
  font-family: 'DM Mono', monospace;
  -webkit-font-smoothing: antialiased;
  display: flex; flex-direction: column;
}
#cam-wrap { position: relative; flex: 1; min-height: 0; background: #000; overflow: hidden; }
video { width: 100%; height: 100%; object-fit: cover; display: block; }
#overlay { position: absolute; inset: 0; width: 100%; height: 100%; }

/* Start screen */
#cam-start {
  display: flex; position: absolute; inset: 0;
  flex-direction: column; align-items: center; justify-content: center;
  gap: 20px; background: #0e1a0e; padding: 32px; text-align: center;
}
#cam-start h2 { font-family: 'Barlow Condensed', sans-serif; font-size: 36px; font-weight: 700; }
#cam-start p  { font-family: 'Barlow Condensed', sans-serif; font-size: 20px; color: #7a9a7a; max-width: 280px; line-height: 1.4; }
#cam-start button {
  font-family: 'Barlow Condensed', sans-serif; font-size: 22px; font-weight: 700;
  letter-spacing: 0.07em; text-transform: uppercase;
  background: #e8f54d; color: #0e1a0e;
  border: none; border-radius: 8px; padding: 16px 40px; cursor: pointer;
}
#cam-denied { display: none; position: absolute; inset: 0; flex-direction: column; align-items: center; justify-content: center; gap: 16px; background: #0e1a0e; padding: 32px; text-align: center; }
#cam-denied.show { display: flex; }
#cam-denied h2 { font-family: 'Barlow Condensed', sans-serif; font-size: 28px; font-weight: 600; }
#cam-denied p  { font-family: 'Barlow Condensed', sans-serif; font-size: 18px; color: #7a9a7a; max-width: 280px; line-height: 1.4; }
#cam-denied button { font-family: 'Barlow Condensed', sans-serif; font-size: 18px; font-weight: 700; background: #e8f54d; color: #0e1a0e; border: none; border-radius: 6px; padding: 12px 28px; cursor: pointer; }

/* Panel */
#panel {
  background: #0e1a0e; border-top: 2px solid #1e321e;
  padding: 14px 18px 18px; flex-shrink: 0;
  display: flex; flex-direction: column; gap: 12px;
}

/* Gimme selector */
#gimme-row { display: flex; gap: 8px; }
.gimme-btn {
  font-family: 'Barlow Condensed', sans-serif; font-size: 22px; font-weight: 700;
  background: #1c2e1c; color: #7a9a7a;
  border: 2px solid #2c422c; border-radius: 6px;
  padding: 8px 0; cursor: pointer; flex: 1;
  transition: all 0.15s; -webkit-tap-highlight-color: transparent;
}
.gimme-btn.active { background: #243824; color: #e8f54d; border-color: #e8f54d; }

/* Status + distance */
#status-row { display: flex; align-items: center; gap: 10px; }
#status-dot { width: 12px; height: 12px; border-radius: 50%; background: #4a6a4a; flex-shrink: 0; transition: background 0.3s; }
#status-dot.searching { background: #e8a020; animation: pulse 1s ease-in-out infinite; }
#status-dot.locked    { background: #72d472; animation: none; }
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }
#status-text { font-family: 'Barlow Condensed', sans-serif; font-size: 18px; color: #7a9a7a; }

#distance-row { display: flex; align-items: baseline; gap: 10px; }
#distance { font-size: 64px; font-weight: 500; line-height: 1; font-variant-numeric: tabular-nums; letter-spacing: -0.03em; color: #e8f54d; }
#verdict { font-family: 'Barlow Condensed', sans-serif; font-size: 22px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; }
#verdict.good { color: #72d472; }
#verdict.bad  { color: #e06060; }
#verdict.none { color: #4a6a4a; }

/* Tips */
#tips { font-family: 'Barlow Condensed', sans-serif; font-size: 16px; color: #4a6a4a; line-height: 1.3; }
</style>

<div id="cam-wrap">
  <video id="video" autoplay playsinline muted></video>
  <canvas id="overlay"></canvas>
  <div id="cam-start">
    <h2>Gimme Check</h2>
    <p>Point camera straight down at the hole and ball. Distance appears automatically.</p>
    <button id="btn-start">Start Camera</button>
  </div>
  <div id="cam-denied">
    <h2>Camera blocked</h2>
    <p>Tap the lock icon in the address bar, set Camera to Allow, then reload.</p>
    <button onclick="location.reload()">Reload</button>
  </div>
</div>

<div id="panel">
  <div>
    <div style="font-family:'Barlow Condensed',sans-serif;font-size:13px;font-weight:600;letter-spacing:0.12em;text-transform:uppercase;color:#7a9a7a;margin-bottom:6px;">Gimme distance</div>
    <div id="gimme-row">
      <button class="gimme-btn" data-in="12">12"</button>
      <button class="gimme-btn" data-in="18">18"</button>
      <button class="gimme-btn active" data-in="24">24"</button>
      <button class="gimme-btn" data-in="36">36"</button>
    </div>
  </div>

  <div id="status-row">
    <div id="status-dot"></div>
    <div id="status-text">Start camera to begin</div>
  </div>

  <div id="distance-row">
    <div id="distance">—</div>
    <div id="verdict" class="none"></div>
  </div>

  <div id="tips">Point camera straight down · Hole = dark circle · Ball = white</div>
</div>

<script>
const video   = document.getElementById('video');
const overlay = document.getElementById('overlay');
const ctx     = overlay.getContext('2d');
const denied  = document.getElementById('cam-denied');
const camStart= document.getElementById('cam-start');
const statusDot  = document.getElementById('status-dot');
const statusText = document.getElementById('status-text');
const distEl  = document.getElementById('distance');
const verdEl  = document.getElementById('verdict');
const tips    = document.getElementById('tips');

const HOLE_DIA_IN = 4.25;
let gimmeIn = 24;
let running = false;
let animId  = null;

// Small offscreen canvas for fast pixel analysis
const W = 160, H = 120;
const off = document.createElement('canvas');
off.width = W; off.height = H;
const offCtx = off.getContext('2d', { willReadFrequently: true });

document.querySelectorAll('.gimme-btn').forEach(b => {
  b.addEventListener('click', () => {
    document.querySelectorAll('.gimme-btn').forEach(x => x.classList.remove('active'));
    b.classList.add('active');
    gimmeIn = parseInt(b.dataset.in);
  });
});

// ── Camera ──────────────────────────────────────────────
document.getElementById('btn-start').addEventListener('click', initCamera);
async function initCamera() {
  camStart.style.display = 'none';
  try {
    const stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: { ideal: 'environment' }, width: { ideal: 1280 } }
    });
    video.srcObject = stream;
    video.addEventListener('loadedmetadata', () => {
      syncCanvas();
      running = true;
      loop();
    });
  } catch { denied.classList.add('show'); }
}

window.addEventListener('resize', syncCanvas);
function syncCanvas() {
  const r = overlay.parentElement.getBoundingClientRect();
  overlay.width = r.width; overlay.height = r.height;
}

// ── Detection ────────────────────────────────────────────
let debugInfo = '';

function clusterPx(pixels, minCount, minRad, maxRadFrac) {
  if (pixels.length < minCount) return null;
  let sx=0, sy=0;
  for (const [x,y] of pixels) { sx+=x; sy+=y; }
  let cx=sx/pixels.length, cy=sy/pixels.length;
  // Prune outliers twice to converge on the main cluster
  let pts = pixels;
  for (let i=0; i<2; i++) {
    const re = Math.sqrt(pts.length / Math.PI);
    pts = pts.filter(([x,y]) => Math.hypot(x-cx, y-cy) < re*2.5);
    if (pts.length < minCount) return null;
    sx=0; sy=0;
    for (const [x,y] of pts) { sx+=x; sy+=y; }
    cx=sx/pts.length; cy=sy/pts.length;
  }
  const rad = Math.sqrt(pts.length / Math.PI);
  if (rad < minRad || rad > W * maxRadFrac) return null;
  return { cx, cy, rad, n: pts.length };
}

function analyze() {
  offCtx.drawImage(video, 0, 0, W, H);
  const data = offCtx.getImageData(0, 0, W, H).data;

  const darkPx = [], whitePx = [];
  let minL=255, maxL=0;

  for (let y=0; y<H; y++) {
    for (let x=0; x<W; x++) {
      const i = (y*W+x)*4;
      const r=data[i], g=data[i+1], b=data[i+2];
      const luma = 0.299*r + 0.587*g + 0.114*b;
      const sat  = Math.max(r,g,b) - Math.min(r,g,b);
      if (luma < minL) minL = luma;
      if (luma > maxL) maxL = luma;

      // Hole: darkest pixels that aren't green-tinted grass shadow
      // (grass shadow: g channel much higher than r and b)
      if (luma < 75 && (g - Math.min(r,b)) < 30) darkPx.push([x,y]);

      // Ball: bright white, low saturation (not yellow flag / sun glare on metal)
      if (luma > 165 && sat < 60) whitePx.push([x,y]);
    }
  }

  const scaleX = overlay.width / W;
  const scaleY = overlay.height / H;
  const avgScale = (scaleX + scaleY) / 2;

  debugInfo = `dark:${darkPx.length} white:${whitePx.length} luma ${Math.round(minL)}-${Math.round(maxL)}`;

  let hole = null, ball = null;

  const hc = clusterPx(darkPx,  8, 2, 0.45);
  if (hc) hole = { x: hc.cx*scaleX, y: hc.cy*scaleY, r: Math.max(8, hc.rad*avgScale) };

  const bc = clusterPx(whitePx, 5, 2, 0.42);
  if (bc) ball = { x: bc.cx*scaleX, y: bc.cy*scaleY, r: Math.max(10, bc.rad*avgScale) };

  return { hole, ball };
}

// ── Draw ────────────────────────────────────────────────
function drawCircle(cx, cy, r, col, lw = 2.5) {
  ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI*2);
  ctx.strokeStyle = col; ctx.lineWidth = lw; ctx.stroke();
}
function drawCross(cx, cy, size, col) {
  ctx.strokeStyle = col; ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(cx - size, cy); ctx.lineTo(cx + size, cy);
  ctx.moveTo(cx, cy - size); ctx.lineTo(cx, cy + size);
  ctx.stroke();
}
function drawLine(ax, ay, bx, by, col) {
  ctx.beginPath(); ctx.moveTo(ax, ay); ctx.lineTo(bx, by);
  ctx.strokeStyle = col; ctx.lineWidth = 2.5;
  ctx.setLineDash([8,5]); ctx.stroke(); ctx.setLineDash([]);
}
function badge(txt, x, y, col) {
  ctx.font = 'bold 13px "DM Mono", monospace';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  const w = ctx.measureText(txt).width + 12, h = 22;
  ctx.fillStyle = 'rgba(14,26,14,0.85)';
  ctx.beginPath(); ctx.roundRect(x - w/2, y - h/2, w, h, 3); ctx.fill();
  ctx.fillStyle = col; ctx.fillText(txt, x, y);
}

// ── Main loop ────────────────────────────────────────────
let frameCount = 0;
function loop() {
  if (!running) return;
  animId = requestAnimationFrame(loop);

  // Only analyze every 3rd frame (~20fps → ~7 analyses/sec)
  frameCount++;
  if (frameCount % 3 !== 0) return;

  ctx.clearRect(0, 0, overlay.width, overlay.height);

  if (!video.videoWidth) return;

  const { hole, ball } = analyze();

  if (hole) {
    drawCircle(hole.x, hole.y, hole.r, 'rgba(232,245,77,0.7)', 2.5);
    drawCross(hole.x, hole.y, 7, '#e8f54d');
    badge('HOLE', hole.x, hole.y - hole.r - 14, '#e8f54d');
  }

  if (ball) {
    drawCircle(ball.x, ball.y, ball.r, 'rgba(114,212,114,0.7)', 2.5);
    drawCross(ball.x, ball.y, 7, '#72d472');
    badge('BALL', ball.x, ball.y - ball.r - 14, '#72d472');
  }

  if (hole && ball) {
    // Pixels per inch from hole diameter
    const pxPerIn = (hole.r * 2) / HOLE_DIA_IN;
    const dx = ball.x - hole.x, dy = ball.y - hole.y;
    const distPx = Math.sqrt(dx*dx + dy*dy);
    const inches = distPx / pxPerIn;

    // Draw measurement line
    drawLine(hole.x, hole.y, ball.x, ball.y, '#72d472');
    badge(inches.toFixed(1)+'"',
      (hole.x + ball.x)/2, (hole.y + ball.y)/2 - 14, '#72d472');

    // Update UI
    distEl.textContent = inches.toFixed(1) + ' in';
    if (inches <= gimmeIn) {
      verdEl.textContent = 'Gimme ✓';
      verdEl.className = 'good';
    } else {
      verdEl.textContent = 'Putt it';
      verdEl.className = 'bad';
    }
    statusDot.className = 'locked';
    statusText.textContent = 'Locked on hole and ball';
    tips.style.display = 'none';

  } else {
    distEl.textContent = '—';
    verdEl.textContent = '';
    verdEl.className = 'none';
    statusDot.className = 'searching';
    tips.style.display = '';
    if (!hole && !ball) statusText.textContent = 'Looking for hole and ball…';
    else if (!hole)      statusText.textContent = 'Ball found — looking for hole…';
    else                 statusText.textContent = 'Hole found — looking for ball…';
  }

  // Debug overlay — tap overlay to toggle
  if (showDebug) {
    ctx.font = '11px "DM Mono", monospace';
    ctx.textAlign = 'left'; ctx.textBaseline = 'top';
    ctx.fillStyle = 'rgba(0,0,0,0.6)';
    ctx.fillRect(6, 6, 260, 18);
    ctx.fillStyle = '#e8f54d';
    ctx.fillText(debugInfo, 10, 8);
  }
}

let showDebug = true;
overlay.addEventListener('click', () => { showDebug = !showDebug; });
</script>
