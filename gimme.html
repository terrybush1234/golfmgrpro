<title>Gimme Check</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700&family=DM+Mono:wght@400;500&display=swap">

<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

body {
  height: 100dvh; overflow: hidden;
  background: #0e1a0e; color: #dff0df;
  font-family: 'DM Mono', monospace;
  -webkit-font-smoothing: antialiased;
  display: flex; flex-direction: column;
}

#cam-wrap {
  position: relative; flex: 1; min-height: 0;
  background: #000; overflow: hidden;
}

video { width: 100%; height: 100%; object-fit: cover; display: block; }

#overlay {
  position: absolute; inset: 0;
  width: 100%; height: 100%;
  touch-action: none; cursor: crosshair;
}

/* Start screen */
#cam-start {
  display: flex; position: absolute; inset: 0;
  flex-direction: column; align-items: center; justify-content: center;
  gap: 20px; background: #0e1a0e; padding: 32px; text-align: center;
}
#cam-start h2 { font-family: 'Barlow Condensed', sans-serif; font-size: 36px; font-weight: 700; }
#cam-start p  { font-family: 'Barlow Condensed', sans-serif; font-size: 22px; color: #7a9a7a; max-width: 280px; line-height: 1.4; }
#cam-start button {
  font-family: 'Barlow Condensed', sans-serif; font-size: 22px; font-weight: 700;
  letter-spacing: 0.07em; text-transform: uppercase;
  background: #e8f54d; color: #0e1a0e;
  border: none; border-radius: 8px; padding: 16px 40px; cursor: pointer;
}

/* Denied */
#cam-denied {
  display: none; position: absolute; inset: 0;
  flex-direction: column; align-items: center; justify-content: center;
  gap: 16px; background: #0e1a0e; padding: 32px; text-align: center;
}
#cam-denied.show { display: flex; }
#cam-denied h2 { font-family: 'Barlow Condensed', sans-serif; font-size: 30px; font-weight: 600; }
#cam-denied p  { font-family: 'Barlow Condensed', sans-serif; font-size: 20px; color: #7a9a7a; max-width: 280px; line-height: 1.45; }
#cam-denied button {
  font-family: 'Barlow Condensed', sans-serif; font-size: 20px; font-weight: 700;
  background: #e8f54d; color: #0e1a0e; border: none; border-radius: 6px; padding: 14px 32px; cursor: pointer;
}

/* Panel */
#panel {
  background: #0e1a0e; border-top: 2px solid #243824;
  padding: 16px 18px 20px; flex-shrink: 0;
  display: flex; flex-direction: column; gap: 12px;
}

/* Step dots */
.step-dots { display: flex; align-items: center; gap: 8px; }
.sdot { width: 10px; height: 10px; border-radius: 50%; background: #2c422c; transition: background 0.2s, transform 0.18s; }
.sdot.active { background: #e8f54d; transform: scale(1.3); }
.sdot.done   { background: #72d472; }
.ssep { width: 24px; height: 1px; background: #2c422c; }

/* Instruction */
.eyebrow {
  font-family: 'Barlow Condensed', sans-serif; font-size: 14px; font-weight: 600;
  letter-spacing: 0.13em; text-transform: uppercase; color: #7a9a7a;
}
.instr {
  font-family: 'Barlow Condensed', sans-serif; font-size: 28px; font-weight: 600;
  color: #dff0df; line-height: 1.2;
}

/* Gimme distance picker */
#gimme-row {
  display: flex; gap: 8px; flex-wrap: wrap;
}
.gimme-btn {
  font-family: 'Barlow Condensed', sans-serif; font-size: 20px; font-weight: 700;
  letter-spacing: 0.04em;
  background: #1c2e1c; color: #7a9a7a;
  border: 2px solid #2c422c; border-radius: 6px;
  padding: 8px 14px; cursor: pointer; flex: 1;
  transition: all 0.15s; -webkit-tap-highlight-color: transparent;
}
.gimme-btn.active { background: #243824; color: #e8f54d; border-color: #e8f54d; }

/* Size slider */
#size-pane { display: flex; flex-direction: column; gap: 8px; }
#size-label {
  font-family: 'Barlow Condensed', sans-serif; font-size: 22px; font-weight: 700;
  color: #e8f54d; letter-spacing: 0.04em;
}
#size-slider {
  width: 100%; height: 32px;
  accent-color: #e8f54d; cursor: pointer;
}

/* Result */
#result-pane { display: none; flex-direction: column; gap: 4px; }
#result-pane.show { display: flex; }
.rlabel { font-family: 'Barlow Condensed', sans-serif; font-size: 14px; font-weight: 600; letter-spacing: 0.13em; text-transform: uppercase; color: #7a9a7a; }
#distance { font-size: 60px; font-weight: 500; line-height: 1; font-variant-numeric: tabular-nums; letter-spacing: -0.02em; color: #e8f54d; }
#verdict { font-family: 'Barlow Condensed', sans-serif; font-size: 24px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; }
#verdict.good { color: #72d472; }
#verdict.bad  { color: #e06060; }

/* Buttons */
#btn-row { display: flex; gap: 10px; }
button.action {
  font-family: 'Barlow Condensed', sans-serif; font-size: 20px; font-weight: 700;
  letter-spacing: 0.06em; text-transform: uppercase;
  border: none; border-radius: 6px; padding: 12px 20px; cursor: pointer;
  transition: opacity 0.12s; -webkit-tap-highlight-color: transparent;
}
button.action:hover { opacity: 0.8; }
#btn-again { flex: 1; background: #243824; color: #dff0df; }
#btn-reset { background: #1c2e1c; color: #7a9a7a; }
.hidden { display: none !important; }
</style>

<div id="cam-wrap">
  <video id="video" autoplay playsinline muted></video>
  <canvas id="overlay"></canvas>
  <div id="cam-start">
    <h2>Gimme Check</h2>
    <p>Point camera at the hole and ball to measure distance.</p>
    <button id="btn-start-cam">Start Camera</button>
  </div>
  <div id="cam-denied">
    <h2>Camera blocked</h2>
    <p>Tap the lock icon in the address bar, set Camera to Allow, then reload.</p>
    <button onclick="location.reload()">Reload</button>
  </div>
</div>

<div id="panel">
  <div class="step-dots">
    <div class="sdot" id="sd0"></div>
    <div class="ssep"></div>
    <div class="sdot" id="sd1"></div>
  </div>

  <!-- Gimme distance selector (always visible) -->
  <div>
    <div class="eyebrow" style="margin-bottom:6px;">Gimme distance</div>
    <div id="gimme-row">
      <button class="gimme-btn" data-in="12">12"</button>
      <button class="gimme-btn" data-in="18">18"</button>
      <button class="gimme-btn active" data-in="24">24"</button>
      <button class="gimme-btn" data-in="36">36"</button>
    </div>
  </div>

  <!-- Instruction (hole + ball phases) -->
  <div id="info-pane">
    <div class="eyebrow" id="eyebrow">Step 1 — Find the hole</div>
    <div class="instr" id="instr">Tap the center of the hole</div>
  </div>

  <!-- Size slider (ball phase only) -->
  <div id="size-pane" class="hidden">
    <div id="size-label">⬅ Adjust circle size ➡</div>
    <input type="range" id="size-slider" min="0.5" max="4.0" step="0.05" value="1.0">
  </div>

  <!-- Result -->
  <div id="result-pane">
    <div class="rlabel">Distance to hole</div>
    <div id="distance">—</div>
    <div id="verdict"></div>
  </div>

  <!-- Buttons -->
  <div id="btn-row">
    <button class="action" id="btn-again">Measure Again</button>
    <button class="action hidden" id="btn-reset">Reset Hole</button>
  </div>
</div>

<script>
const video    = document.getElementById('video');
const overlay  = document.getElementById('overlay');
const ctx      = overlay.getContext('2d');
const camStart = document.getElementById('cam-start');
const denied   = document.getElementById('cam-denied');
const eyebrow  = document.getElementById('eyebrow');
const instr    = document.getElementById('instr');
const infoPane = document.getElementById('info-pane');
const sizePane = document.getElementById('size-pane');
const sizeSlider = document.getElementById('size-slider');
const resPane  = document.getElementById('result-pane');
const distEl   = document.getElementById('distance');
const verdEl   = document.getElementById('verdict');
const btnAgain = document.getElementById('btn-again');
const btnReset = document.getElementById('btn-reset');
const dots     = [document.getElementById('sd0'), document.getElementById('sd1')];

const HOLE_DIA_IN  = 4.25;
const NUM_RAYS     = 24;
const COLOR_THRESH = 45;
const MIN_RADIUS   = 8;

let gimmeIn = 24;
document.querySelectorAll('.gimme-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.gimme-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    gimmeIn = parseInt(btn.dataset.in);
    if (phase === 'result' && ballPt) showResult(dist(holeCenter, ballPt) / pxPerIn);
  });
});

const offscreen = document.createElement('canvas');
const offCtx    = offscreen.getContext('2d', { willReadFrequently: true });

let phase = 'hole';
let holeCenter = null, holeRadPxRaw = null, holeRadPx = null, pxPerIn = null;
let ballPt = null;

sizeSlider.addEventListener('input', () => {
  const scale = parseFloat(sizeSlider.value);
  holeRadPx = holeRadPxRaw * scale;
  pxPerIn   = (holeRadPx * 2) / HOLE_DIA_IN;
  redraw();
});

// ── Camera ──────────────────────────────────────────────
document.getElementById('btn-start-cam').addEventListener('click', initCamera);
async function initCamera() {
  camStart.style.display = 'none';
  try {
    const stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: { ideal: 'environment' }, width: { ideal: 1920 } }
    });
    video.srcObject = stream;
  } catch (err) {
    denied.classList.add('show');
  }
}
video.addEventListener('loadedmetadata', syncCanvas);
window.addEventListener('resize', syncCanvas);
function syncCanvas() {
  const r = overlay.parentElement.getBoundingClientRect();
  overlay.width = offscreen.width = r.width;
  overlay.height = offscreen.height = r.height;
  redraw();
}

// ── Pixel detection ──────────────────────────────────────
function captureFrame() {
  offCtx.drawImage(video, 0, 0, offscreen.width, offscreen.height);
}
function getPixel(x, y) {
  return offCtx.getImageData(Math.round(x), Math.round(y), 1, 1).data;
}
function colorDist(a, b) {
  return Math.sqrt((a[0]-b[0])**2 + (a[1]-b[1])**2 + (a[2]-b[2])**2);
}
function detectHole(tapX, tapY) {
  captureFrame();
  const ref = getPixel(tapX, tapY);
  function same(x, y) {
    if (x < 0 || y < 0 || x >= offscreen.width || y >= offscreen.height) return false;
    return colorDist(ref, getPixel(x, y)) < COLOR_THRESH;
  }
  const radii = [];
  for (let i = 0; i < NUM_RAYS; i++) {
    const angle = (i / NUM_RAYS) * Math.PI * 2;
    const dx = Math.cos(angle), dy = Math.sin(angle);
    let r = 1;
    while (r < 300) {
      if (!same(tapX + dx * r, tapY + dy * r)) { radii.push(r - 1); break; }
      r++;
    }
    if (r >= 300) radii.push(null);
  }
  const valid = radii.filter(r => r !== null && r >= MIN_RADIUS);
  if (valid.length < NUM_RAYS * 0.5) return null;
  valid.sort((a, b) => a - b);
  const trim = Math.floor(valid.length * 0.1);
  const trimmed = valid.slice(trim, valid.length - trim);
  const avg = trimmed.reduce((s, v) => s + v, 0) / trimmed.length;
  return avg < MIN_RADIUS ? null : avg;
}

// ── Coords ───────────────────────────────────────────────
function pt(e) {
  const r = overlay.getBoundingClientRect();
  const s = e.changedTouches ? e.changedTouches[0] : e;
  return { x: (s.clientX - r.left) * (overlay.width / r.width),
           y: (s.clientY - r.top)  * (overlay.height / r.height) };
}
function dist(a, b) { return Math.hypot(b.x - a.x, b.y - a.y); }

// ── Draw ─────────────────────────────────────────────────
function drawDot(p, col, r = 10) {
  ctx.beginPath(); ctx.arc(p.x, p.y, r, 0, Math.PI*2);
  ctx.fillStyle = col; ctx.fill();
  ctx.beginPath(); ctx.arc(p.x, p.y, r + 4, 0, Math.PI*2);
  ctx.strokeStyle = 'rgba(255,255,255,0.35)'; ctx.lineWidth = 2; ctx.stroke();
}
function drawCircle(c, r, col, lw = 2.5, alpha = 1) {
  ctx.globalAlpha = alpha;
  ctx.beginPath(); ctx.arc(c.x, c.y, r, 0, Math.PI*2);
  ctx.strokeStyle = col; ctx.lineWidth = lw; ctx.stroke();
  ctx.globalAlpha = 1;
}
function drawLine(a, b, col) {
  ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y);
  ctx.strokeStyle = col; ctx.lineWidth = 2.5;
  ctx.setLineDash([8, 5]); ctx.stroke(); ctx.setLineDash([]);
}
function badge(txt, p, col, above) {
  ctx.font = 'bold 14px "DM Mono", monospace';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  const w = ctx.measureText(txt).width + 14, h = 24;
  const bx = p.x - w/2, by = p.y - (above ? h + 10 : -10);
  ctx.fillStyle = 'rgba(14,26,14,0.85)';
  ctx.beginPath(); ctx.roundRect(bx, by, w, h, 4); ctx.fill();
  ctx.fillStyle = col; ctx.fillText(txt, p.x, by + h/2);
}
function redraw() {
  ctx.clearRect(0, 0, overlay.width, overlay.height);
  if (holeCenter && holeRadPx) {
    drawCircle(holeCenter, holeRadPx, 'rgba(232,245,77,0.6)', 2.5);
    drawDot(holeCenter, '#e8f54d', 6);
  }
  if (phase === 'result' && ballPt) {
    drawLine(holeCenter, ballPt, '#72d472');
    drawDot(ballPt, '#72d472');
    const mid = { x: (holeCenter.x + ballPt.x)/2, y: (holeCenter.y + ballPt.y)/2 };
    badge((dist(holeCenter, ballPt)/pxPerIn).toFixed(1)+'"', mid, '#72d472', ballPt.y > holeCenter.y);
  }
}

// ── Tap ──────────────────────────────────────────────────
function onTap(e) {
  e.preventDefault();
  const p = pt(e);
  if (phase === 'hole') {
    const r = detectHole(p.x, p.y);
    if (r) {
      holeCenter = p; holeRadPxRaw = r; holeRadPx = r;
      pxPerIn = (r * 2) / HOLE_DIA_IN;
      sizeSlider.value = '1.0';
      phase = 'ball'; updateUI();
    } else {
      instr.textContent = "No edge found — tap on the hole";
      setTimeout(() => { instr.textContent = 'Tap the center of the hole'; }, 2000);
    }
    redraw();
  } else if (phase === 'ball') {
    ballPt = p;
    showResult(dist(holeCenter, ballPt) / pxPerIn);
    phase = 'result'; updateUI(); redraw();
  }
}
overlay.addEventListener('click', onTap);
overlay.addEventListener('touchend', onTap, { passive: false });

function showResult(inches) {
  distEl.textContent = inches.toFixed(1) + ' in';
  if (inches <= gimmeIn) {
    verdEl.textContent = `Gimme — within ${gimmeIn}"`;
    verdEl.className = 'good';
  } else {
    verdEl.textContent = `Putt it out — outside ${gimmeIn}"`;
    verdEl.className = 'bad';
  }
}

// ── Buttons ───────────────────────────────────────────────
btnAgain.addEventListener('click', () => { ballPt = null; phase = 'ball'; updateUI(); redraw(); });
btnReset.addEventListener('click', () => {
  holeCenter = holeRadPxRaw = holeRadPx = pxPerIn = ballPt = null;
  phase = 'hole'; updateUI(); redraw();
});

// ── UI state ──────────────────────────────────────────────
function updateUI() {
  const map = {
    hole:   { eye: 'Step 1 — Find the hole', ins: 'Tap the center of the hole',     d: ['active',''] },
    ball:   { eye: 'Step 2 — Measure',       ins: 'Tap the center of the golf ball', d: ['done','active'] },
    result: { eye: '',                        ins: '',                                d: ['done','done'] },
  };
  const s = map[phase];
  eyebrow.textContent = s.eye;
  instr.textContent   = s.ins;
  dots.forEach((d, i) => {
    d.className = 'sdot';
    if (s.d[i] === 'active') d.classList.add('active');
    if (s.d[i] === 'done')   d.classList.add('done');
  });
  infoPane.style.display  = phase === 'result' ? 'none' : '';
  sizePane.classList.toggle('hidden', phase !== 'ball');
  resPane.classList.toggle('show',    phase === 'result');
  btnReset.classList.toggle('hidden', phase === 'hole');
}

updateUI();
syncCanvas();
</script>
