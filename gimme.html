<title>Gimme Check</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700&family=DM+Mono:wght@400;500&display=swap">

<style>
*, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
body {
  height:100dvh; overflow:hidden; background:#0e1a0e; color:#dff0df;
  font-family:'DM Mono',monospace; display:flex; flex-direction:column;
  user-select:none; -webkit-user-select:none;
}
#cam-wrap { position:relative; flex:1; min-height:0; background:#000; overflow:hidden; }
video { width:100%; height:100%; object-fit:cover; display:block; }
#overlay { position:absolute; inset:0; width:100%; height:100%; touch-action:none; cursor:crosshair; }

#cam-start {
  display:flex; position:absolute; inset:0; flex-direction:column;
  align-items:center; justify-content:center; gap:20px;
  background:#0e1a0e; padding:32px; text-align:center;
}
#cam-start h2 { font-family:'Barlow Condensed',sans-serif; font-size:36px; font-weight:700; }
#cam-start p  { font-family:'Barlow Condensed',sans-serif; font-size:20px; color:#7a9a7a; max-width:300px; line-height:1.5; }
#cam-start button {
  font-family:'Barlow Condensed',sans-serif; font-size:24px; font-weight:700;
  letter-spacing:.07em; text-transform:uppercase; background:#e8f54d; color:#0e1a0e;
  border:none; border-radius:8px; padding:16px 40px; cursor:pointer;
}
#cam-denied { display:none; position:absolute; inset:0; flex-direction:column; align-items:center; justify-content:center; gap:16px; background:#0e1a0e; padding:32px; text-align:center; }
#cam-denied.show { display:flex; }
#cam-denied h2 { font-family:'Barlow Condensed',sans-serif; font-size:28px; }
#cam-denied p  { font-family:'Barlow Condensed',sans-serif; font-size:18px; color:#7a9a7a; max-width:280px; line-height:1.4; }
#cam-denied button { font-family:'Barlow Condensed',sans-serif; font-size:18px; font-weight:700; background:#e8f54d; color:#0e1a0e; border:none; border-radius:6px; padding:12px 28px; cursor:pointer; }

#panel {
  background:#0e1a0e; border-top:2px solid #1e321e;
  padding:14px 18px 18px; flex-shrink:0; display:flex; flex-direction:column; gap:12px;
}
#gimme-row { display:flex; gap:8px; }
.gimme-btn {
  font-family:'Barlow Condensed',sans-serif; font-size:22px; font-weight:700;
  background:#1c2e1c; color:#7a9a7a; border:2px solid #2c422c;
  border-radius:6px; padding:8px 0; cursor:pointer; flex:1;
  -webkit-tap-highlight-color:transparent;
}
.gimme-btn.active { background:#243824; color:#e8f54d; border-color:#e8f54d; }
#status-text { font-family:'Barlow Condensed',sans-serif; font-size:22px; color:#7a9a7a; }
#distance-row { display:flex; align-items:baseline; gap:10px; }
#distance { font-size:64px; font-weight:500; line-height:1; font-variant-numeric:tabular-nums; letter-spacing:-.03em; color:#e8f54d; }
#verdict { font-family:'Barlow Condensed',sans-serif; font-size:26px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; }
#verdict.good { color:#72d472; }
#verdict.bad  { color:#e06060; }
#tips { font-family:'Barlow Condensed',sans-serif; font-size:20px; color:#7a9a7a; line-height:1.35; }
#reset-btn {
  font-family:'Barlow Condensed',sans-serif; font-size:22px; font-weight:700;
  background:#1c2e1c; color:#7a9a7a; border:2px solid #2c422c;
  border-radius:6px; padding:10px 0; cursor:pointer; width:100%;
  -webkit-tap-highlight-color:transparent;
}
</style>

<div id="cam-wrap">
  <video id="video" autoplay playsinline muted></video>
  <canvas id="overlay"></canvas>
  <div id="cam-start">
    <h2>Gimme Check</h2>
    <p>Draw one box around both the <span style="color:#e8f54d">hole</span> and the <span style="color:#72d472">ball</span> — hole on left, ball on right.</p>
    <button id="btn-start">Start Camera</button>
  </div>
  <div id="cam-denied">
    <h2>Camera blocked</h2>
    <p>Tap the lock icon in the address bar, set Camera to Allow, then reload.</p>
    <button onclick="location.reload()">Reload</button>
  </div>
</div>

<div id="panel">
  <div>
    <div style="font-family:'Barlow Condensed',sans-serif;font-size:16px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:#7a9a7a;margin-bottom:6px;">Gimme distance</div>
    <div id="gimme-row">
      <button class="gimme-btn" data-in="12">12"</button>
      <button class="gimme-btn" data-in="18">18"</button>
      <button class="gimme-btn active" data-in="24">24"</button>
      <button class="gimme-btn" data-in="36">36"</button>
    </div>
  </div>
  <div id="status-text">Start camera to begin</div>
  <div id="distance-row">
    <div id="distance">—</div>
    <div id="verdict"></div>
  </div>
  <div id="tips"></div>
  <button id="reset-btn">Measure Again</button>
</div>

<script>
const HOLE_DIA_IN = 4.25;
const BALL_DIA_IN = 1.68;

const video     = document.getElementById('video');
const overlay   = document.getElementById('overlay');
const ctx       = overlay.getContext('2d');
const statusTxt = document.getElementById('status-text');
const distEl    = document.getElementById('distance');
const verdEl    = document.getElementById('verdict');
const tips      = document.getElementById('tips');

let gimmeIn = 24, running = false;
let state = 'draw'; // 'draw' | 'done'

// The single box drawn by user
let sceneBox = null;
// Box being drawn right now
let drawing = null; // { startX, startY, curX, curY }

// Detected rings (animated): { x,y,r,targetX,targetY,targetR,snapped,color,label }
let rings;

function syncCanvas() {
  const rect = overlay.parentElement.getBoundingClientRect();
  overlay.width = rect.width; overlay.height = rect.height;
}

function initRings() {
  // Rings start hidden (r=0) — they animate in after detection
  rings = [
    { x:0,y:0,r:0,targetX:0,targetY:0,targetR:0,snapped:false,color:'#e8f54d',label:'HOLE' },
    { x:0,y:0,r:0,targetX:0,targetY:0,targetR:0,snapped:false,color:'#72d472',label:'BALL' },
  ];
}

// ── Offscreen canvas ──────────────────────────────────────────────────────
const OW = 320, OH = 240;
const off = document.createElement('canvas');
off.width = OW; off.height = OH;
const offCtx = off.getContext('2d', { willReadFrequently:true });

function getVideoCrop() {
  const vW=video.videoWidth, vH=video.videoHeight, dW=overlay.width, dH=overlay.height;
  if (!vW||!dW) return {sx:0,sy:0,sw:vW||1,sh:vH||1};
  const vAR=vW/vH, dAR=dW/dH;
  let sx,sy,sw,sh;
  if (vAR>dAR) { sh=vH; sw=vH*dAR; sx=(vW-sw)/2; sy=0; }
  else         { sw=vW; sh=vW/dAR; sx=0; sy=(vH-sh)/2; }
  return {sx,sy,sw,sh};
}

function captureFrame() {
  const {sx,sy,sw,sh}=getVideoCrop();
  offCtx.drawImage(video,sx,sy,sw,sh,0,0,OW,OH);
  return offCtx.getImageData(0,0,OW,OH).data;
}

// Screen ↔ offscreen
const s2o = (sx,sy) => ({ ox:(sx/overlay.width)*OW, oy:(sy/overlay.height)*OH });
const o2s = (ox,oy) => ({ sx:(ox/OW)*overlay.width, sy:(oy/OH)*overlay.height });

// ── Pixel helpers ─────────────────────────────────────────────────────────
function luma(data,ox,oy) {
  const i=(Math.round(oy)*OW+Math.round(ox))*4;
  return 0.299*data[i]+0.587*data[i+1]+0.114*data[i+2];
}
function avgLuma(data,ox,oy,r) {
  let sum=0,n=0;
  const ir=Math.ceil(r);
  for (let dy=-ir;dy<=ir;dy++) for (let dx=-ir;dx<=ir;dx++) {
    if (dx*dx+dy*dy>r*r) continue;
    const nx=Math.round(ox+dx), ny=Math.round(oy+dy);
    if (nx<0||nx>=OW||ny<0||ny>=OH) continue;
    sum+=luma(data,nx,ny); n++;
  }
  return n?sum/n:128;
}

// Convert screen box to offscreen box
function screenBoxToOff(sMinX,sMinY,sMaxX,sMaxY) {
  return {
    oMinX: Math.max(0, Math.floor((sMinX/overlay.width)*OW)),
    oMaxX: Math.min(OW-1, Math.ceil((sMaxX/overlay.width)*OW)),
    oMinY: Math.max(0, Math.floor((sMinY/overlay.height)*OH)),
    oMaxY: Math.min(OH-1, Math.ceil((sMaxY/overlay.height)*OH)),
  };
}

// Detect hole (dark) or ball (bright) strictly within a screen-coord box.
// Uses local histogram stretching so bright outdoor conditions don't fool detection.
// 1. Normalize luma within box to full 0-255 range
// 2. Find seed (darkest/brightest normalized pixel)
// 3. Flood-fill from seed — connected pixels within 25% threshold
// 4. Centroid + area → center and radius
// Returns screen coords {x, y, r} or null.
function findObjectInBounds(sMinX,sMinY,sMaxX,sMaxY, mode) {
  const data=captureFrame();
  const {oMinX,oMaxX,oMinY,oMaxY}=screenBoxToOff(sMinX,sMinY,sMaxX,sMaxY);

  // 0. Local histogram stretch — normalize luma in this box to 0-255
  //    This makes detection work regardless of ambient brightness (indoor vs bright sun)
  let minL=255, maxL=0;
  for (let y=oMinY;y<=oMaxY;y++)
    for (let x=oMinX;x<=oMaxX;x++) {
      const v=luma(data,x,y);
      if (v<minL) minL=v;
      if (v>maxL) maxL=v;
    }
  const range=maxL-minL||1;
  const lumaLocal=(x,y)=>(luma(data,x,y)-minL)/range*255;

  // 1. Find seed — extreme pixel in box (using normalized luma)
  let bestVal=mode==='dark'?999:-1, seedX=Math.round((oMinX+oMaxX)/2), seedY=Math.round((oMinY+oMaxY)/2);
  for (let y=oMinY;y<=oMaxY;y++) {
    for (let x=oMinX;x<=oMaxX;x++) {
      const v=lumaLocal(x,y);
      if ((mode==='dark'&&v<bestVal)||(mode==='bright'&&v>bestVal)) {
        bestVal=v; seedX=x; seedY=y;
      }
    }
  }

  // 2. Tight threshold: 25% of the way from seed toward median (normalized)
  let vals=[];
  for (let y=oMinY;y<=oMaxY;y++)
    for (let x=oMinX;x<=oMaxX;x++) vals.push(lumaLocal(x,y));
  vals.sort((a,b)=>a-b);
  const medianV=vals[Math.floor(vals.length/2)];
  const thresh = mode==='dark'
    ? bestVal + (medianV-bestVal)*0.25
    : bestVal - (bestVal-medianV)*0.25;

  // Max radius cap
  const maxFillR = (oMaxX-oMinX)*0.60;

  // 3. BFS flood fill from seed
  const visited=new Uint8Array(OW*OH);
  const queue=[[seedX,seedY]];
  visited[seedY*OW+seedX]=1;
  let sumX=0,sumY=0,count=0;
  let bMinX=seedX,bMaxX=seedX,bMinY=seedY,bMaxY=seedY;
  const dirs=[[-1,0],[1,0],[0,-1],[0,1]];
  while (queue.length) {
    const [x,y]=queue.pop();
    const v=lumaLocal(x,y);
    const inObj=mode==='dark'?v<=thresh:v>=thresh;
    if (!inObj) continue;
    if (Math.hypot(x-seedX,y-seedY)>maxFillR) continue;
    sumX+=x; sumY+=y; count++;
    if (x<bMinX) bMinX=x; if (x>bMaxX) bMaxX=x;
    if (y<bMinY) bMinY=y; if (y>bMaxY) bMaxY=y;
    for (const [dx,dy] of dirs) {
      const nx=x+dx, ny=y+dy;
      if (nx<oMinX||nx>oMaxX||ny<oMinY||ny>oMaxY) continue;
      if (visited[ny*OW+nx]) continue;
      visited[ny*OW+nx]=1;
      queue.push([nx,ny]);
    }
  }
  if (count<6) return null;

  // Reject blobs that are too elongated (shadow) or too large (fills most of box)
  const blobW=bMaxX-bMinX+1, blobH=bMaxY-bMinY+1;
  const aspect=Math.max(blobW,blobH)/Math.max(Math.min(blobW,blobH),1);
  const boxArea=(oMaxX-oMinX)*(oMaxY-oMinY)||1;
  if (aspect>2.5 || count/boxArea>0.45) return null;

  // 4. Centroid + area-derived radius
  const cx=sumX/count, cy=sumY/count;
  const rOff=Math.sqrt(count/Math.PI);
  const {sx:scx,sy:scy}=o2s(cx,cy);
  return {x:scx, y:scy, r:(rOff/OW)*overlay.width};
}

// ── Animation loop ────────────────────────────────────────────────────────
const EASE=0.18; // lower = slower collapse
let animFrame=null;

function animTick() {
  let still=false;
  for (const ring of rings) {
    const dx=ring.targetX-ring.x, dy=ring.targetY-ring.y, dr=ring.targetR-ring.r;
    if (Math.abs(dx)>0.3||Math.abs(dy)>0.3||Math.abs(dr)>0.3) {
      ring.x+=dx*EASE; ring.y+=dy*EASE; ring.r+=dr*EASE;
      still=true;
    } else {
      ring.x=ring.targetX; ring.y=ring.targetY; ring.r=ring.targetR;
    }
  }
  redraw();
  if (still) animFrame=requestAnimationFrame(animTick);
  else animFrame=null;
}

function startAnim() {
  if (!animFrame) animFrame=requestAnimationFrame(animTick);
}


// ── Result ────────────────────────────────────────────────────────────────
function showResult() {
  const hx=rings[0].targetX, hy=rings[0].targetY, hr=rings[0].targetR;
  const bx=rings[1].targetX, by=rings[1].targetY, br=rings[1].targetR;
  const pxPerIn=(hr*2)/HOLE_DIA_IN;
  const inches=Math.hypot(bx-hx,by-hy)/pxPerIn;
  distEl.textContent=inches.toFixed(1)+' in';
  const isGimme=inches<=gimmeIn;
  verdEl.textContent=isGimme?'Gimme ✓':'Putt it';
  verdEl.className=isGimme?'good':'bad';
  statusTxt.textContent=`${inches.toFixed(1)}" from hole`;
  tips.textContent='Check rings fit hole & ball — if not, Measure Again';
}

// ── Draw box + ring ───────────────────────────────────────────────────────
function drawBox(box, color, label) {
  if (!box) return;
  const {x1,y1,x2,y2}=box;
  const x=Math.min(x1,x2), y=Math.min(y1,y2), w=Math.abs(x2-x1), h=Math.abs(y2-y1);
  ctx.save();
  ctx.strokeStyle=color; ctx.lineWidth=2.5;
  ctx.setLineDash([8,4]); ctx.strokeRect(x,y,w,h); ctx.setLineDash([]);
  // Corner ticks
  const t=14;
  ctx.lineWidth=4;
  [[x,y,1,1],[x+w,y,-1,1],[x,y+h,1,-1],[x+w,y+h,-1,-1]].forEach(([cx,cy,sx,sy])=>{
    ctx.beginPath(); ctx.moveTo(cx,cy+sy*t); ctx.lineTo(cx,cy); ctx.lineTo(cx+sx*t,cy); ctx.stroke();
  });
  // Label
  ctx.font='bold 15px "DM Mono",monospace';
  ctx.textAlign='left'; ctx.textBaseline='top';
  const lw=ctx.measureText(label).width+10;
  ctx.fillStyle='rgba(14,26,14,.88)'; ctx.fillRect(x+4,y+4,lw,22);
  ctx.fillStyle=color; ctx.fillText(label,x+9,y+6);
  ctx.restore();
}

function drawRing(ring) {
  if (ring.r < 2) return;
  ctx.beginPath(); ctx.arc(ring.x,ring.y,ring.r+6,0,Math.PI*2);
  ctx.strokeStyle=ring.color+'60'; ctx.lineWidth=10; ctx.stroke();
  ctx.beginPath(); ctx.arc(ring.x,ring.y,ring.r,0,Math.PI*2);
  ctx.strokeStyle=ring.color; ctx.lineWidth=3.5; ctx.stroke();
  ctx.strokeStyle=ring.color; ctx.lineWidth=2;
  ctx.beginPath();
  ctx.moveTo(ring.x-12,ring.y); ctx.lineTo(ring.x+12,ring.y);
  ctx.moveTo(ring.x,ring.y-12); ctx.lineTo(ring.x,ring.y+12);
  ctx.stroke();
}

function redraw() {
  ctx.clearRect(0,0,overlay.width,overlay.height);
  if (!running) return;

  // Dashed line between rings when both locked
  if (rings[0].snapped && rings[1].snapped) {
    ctx.beginPath(); ctx.moveTo(rings[0].x,rings[0].y); ctx.lineTo(rings[1].x,rings[1].y);
    ctx.strokeStyle='rgba(255,255,255,.3)'; ctx.lineWidth=1.5;
    ctx.setLineDash([7,5]); ctx.stroke(); ctx.setLineDash([]);
  }

  // Completed scene box — draw it split showing hole/ball halves
  if (sceneBox) {
    const {x1,y1,x2,y2}=sceneBox;
    const x=Math.min(x1,x2), y=Math.min(y1,y2), w=Math.abs(x2-x1), h=Math.abs(y2-y1);
    const midX=x+w/2;
    // Hole half (yellow)
    ctx.save(); ctx.strokeStyle='#e8f54d'; ctx.lineWidth=2.5; ctx.setLineDash([8,4]);
    ctx.strokeRect(x,y,w/2,h); ctx.setLineDash([]);
    ctx.font='bold 14px "DM Mono",monospace'; ctx.textAlign='left'; ctx.textBaseline='top';
    ctx.fillStyle='rgba(14,26,14,.88)'; ctx.fillRect(x+4,y+4,54,22);
    ctx.fillStyle='#e8f54d'; ctx.fillText('HOLE',x+9,y+6);
    // Ball half (green)
    ctx.strokeStyle='#72d472'; ctx.setLineDash([8,4]);
    ctx.strokeRect(midX,y,w/2,h); ctx.setLineDash([]);
    ctx.fillStyle='rgba(14,26,14,.88)'; ctx.fillRect(midX+4,y+4,48,22);
    ctx.fillStyle='#72d472'; ctx.fillText('BALL',midX+9,y+6);
    ctx.restore();
  }

  // Box being drawn right now
  if (drawing) {
    drawBox({x1:drawing.startX,y1:drawing.startY,x2:drawing.curX,y2:drawing.curY},
            '#aaccaa','BOX');
  }

  // Detected rings
  drawRing(rings[0]);
  drawRing(rings[1]);
}

// ── Detect inside half of the scene box — fully bounded ──────────────────
function detectHalf(box, side, mode) {
  const {x1,y1,x2,y2}=box;
  const left=Math.min(x1,x2), right=Math.max(x1,x2);
  const top=Math.min(y1,y2),  bot=Math.max(y1,y2);
  const mid=(left+right)/2;
  const bLeft  = side==='left' ? left  : mid;
  const bRight = side==='left' ? mid   : right;
  return findObjectInBounds(bLeft, top, bRight, bot, mode);
}

// ── Touch / mouse: draw boxes ─────────────────────────────────────────────
function getPos(e) {
  const rect=overlay.getBoundingClientRect();
  if (e.touches) {
    const t=e.touches[0];
    return {x:t.clientX-rect.left, y:t.clientY-rect.top};
  }
  return {x:e.clientX-rect.left, y:e.clientY-rect.top};
}

overlay.addEventListener('touchstart', e=>{
  e.preventDefault();
  if (state!=='draw') return;
  const {x,y}=getPos(e);
  drawing={startX:x,startY:y,curX:x,curY:y};
},{passive:false});

overlay.addEventListener('touchmove', e=>{
  e.preventDefault();
  if (!drawing) return;
  const {x,y}=getPos(e);
  drawing.curX=x; drawing.curY=y;
  redraw();
},{passive:false});

overlay.addEventListener('touchend', e=>{
  e.preventDefault(); finishDraw();
});

overlay.addEventListener('mousedown', e=>{
  if (state!=='draw') return;
  const {x,y}=getPos(e);
  drawing={startX:x,startY:y,curX:x,curY:y};
});
overlay.addEventListener('mousemove', e=>{
  if (!drawing) return;
  const {x,y}=getPos(e);
  drawing.curX=x; drawing.curY=y; redraw();
});
overlay.addEventListener('mouseup', ()=>finishDraw());

function finishDraw() {
  if (!drawing || state==='done') { drawing=null; return; }
  const box={x1:drawing.startX,y1:drawing.startY,x2:drawing.curX,y2:drawing.curY};
  const w=Math.abs(box.x2-box.x1), h=Math.abs(box.y2-box.y1);
  drawing=null;
  if (w<40||h<30) { redraw(); return; } // too small — ignore

  sceneBox=box;

  const {x1,y1,x2,y2}=box;
  const left=Math.min(x1,x2), right=Math.max(x1,x2), top=Math.min(y1,y2), bot=Math.max(y1,y2);

  // Hole = left half, detect dark cluster
  const holeFound = detectHalf(box,'left','dark');
  const hx=holeFound?holeFound.x:(left+(right-left)*0.25), hy=holeFound?holeFound.y:(top+bot)/2;
  const hr=holeFound?holeFound.r:(right-left)*0.12;

  // Ball radius derived from hole (most accurate) — center from bright cluster in right half
  const ballR=hr*(BALL_DIA_IN/HOLE_DIA_IN);
  const ballFound = detectHalf(box,'right','bright');
  const bx=ballFound?ballFound.x:(left+(right-left)*0.75), by=ballFound?ballFound.y:(top+bot)/2;

  rings[0]={...rings[0],x:hx,y:hy,r:hr,targetX:hx,targetY:hy,targetR:hr,snapped:true};
  rings[1]={...rings[1],x:bx,y:by,r:ballR,targetX:bx,targetY:by,targetR:ballR,snapped:true};
  startAnim();
  state='done';
  setTimeout(showResult,350);
  redraw();
}

// ── Controls ──────────────────────────────────────────────────────────────
document.querySelectorAll('.gimme-btn').forEach(b=>{
  b.addEventListener('click',()=>{
    document.querySelectorAll('.gimme-btn').forEach(x=>x.classList.remove('active'));
    b.classList.add('active'); gimmeIn=parseInt(b.dataset.in);
    if(state==='done') showResult();
  });
});

function reset() {
  state='draw'; sceneBox=null; drawing=null;
  if(animFrame){cancelAnimationFrame(animFrame);animFrame=null;}
  initRings();
  distEl.textContent='—'; verdEl.textContent=''; verdEl.className='';
  statusTxt.textContent='Draw a box around hole + ball';
  tips.textContent='Drag to surround both — hole on left, ball on right';
  redraw();
}

document.getElementById('reset-btn').addEventListener('click',reset);
window.addEventListener('resize',()=>{syncCanvas();reset();});

document.getElementById('btn-start').addEventListener('click',async()=>{
  document.getElementById('cam-start').style.display='none';
  try {
    const stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:1280}}});
    video.srcObject=stream;
    video.addEventListener('loadedmetadata',()=>{
      syncCanvas(); running=true; reset();
    });
  } catch { document.getElementById('cam-denied').classList.add('show'); }
});
</script>
