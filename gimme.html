<title>Gimme Check</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700&family=DM+Mono:wght@400;500&display=swap">

<style>
*, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
body {
  height:100dvh; overflow:hidden;
  background:#0e1a0e; color:#dff0df;
  font-family:'DM Mono',monospace;
  display:flex; flex-direction:column;
  user-select:none; -webkit-user-select:none;
}
#cam-wrap { position:relative; flex:1; min-height:0; background:#000; overflow:hidden; }
video { width:100%; height:100%; object-fit:cover; display:block; }
#overlay { position:absolute; inset:0; width:100%; height:100%; touch-action:none; cursor:crosshair; }

#cam-start {
  display:flex; position:absolute; inset:0;
  flex-direction:column; align-items:center; justify-content:center;
  gap:20px; background:#0e1a0e; padding:32px; text-align:center;
}
#cam-start h2 { font-family:'Barlow Condensed',sans-serif; font-size:36px; font-weight:700; }
#cam-start p  { font-family:'Barlow Condensed',sans-serif; font-size:20px; color:#7a9a7a; max-width:300px; line-height:1.5; }
#cam-start button {
  font-family:'Barlow Condensed',sans-serif; font-size:24px; font-weight:700;
  letter-spacing:.07em; text-transform:uppercase;
  background:#e8f54d; color:#0e1a0e;
  border:none; border-radius:8px; padding:16px 40px; cursor:pointer;
}
#cam-denied { display:none; position:absolute; inset:0; flex-direction:column; align-items:center; justify-content:center; gap:16px; background:#0e1a0e; padding:32px; text-align:center; }
#cam-denied.show { display:flex; }
#cam-denied h2 { font-family:'Barlow Condensed',sans-serif; font-size:28px; }
#cam-denied p  { font-family:'Barlow Condensed',sans-serif; font-size:18px; color:#7a9a7a; max-width:280px; line-height:1.4; }
#cam-denied button { font-family:'Barlow Condensed',sans-serif; font-size:18px; font-weight:700; background:#e8f54d; color:#0e1a0e; border:none; border-radius:6px; padding:12px 28px; cursor:pointer; }

/* Tap ripple */
@keyframes ripple { to { transform:translate(-50%,-50%) scale(3); opacity:0; } }
.ripple { position:absolute; width:48px; height:48px; border-radius:50%; border:3px solid currentColor; pointer-events:none; animation:ripple .5s ease-out forwards; }

#panel {
  background:#0e1a0e; border-top:2px solid #1e321e;
  padding:14px 18px 18px; flex-shrink:0;
  display:flex; flex-direction:column; gap:12px;
}
#gimme-row { display:flex; gap:8px; }
.gimme-btn {
  font-family:'Barlow Condensed',sans-serif; font-size:22px; font-weight:700;
  background:#1c2e1c; color:#7a9a7a;
  border:2px solid #2c422c; border-radius:6px;
  padding:8px 0; cursor:pointer; flex:1;
  -webkit-tap-highlight-color:transparent;
}
.gimme-btn.active { background:#243824; color:#e8f54d; border-color:#e8f54d; }
#status-text { font-family:'Barlow Condensed',sans-serif; font-size:22px; color:#7a9a7a; }
#distance-row { display:flex; align-items:baseline; gap:10px; }
#distance { font-size:64px; font-weight:500; line-height:1; font-variant-numeric:tabular-nums; letter-spacing:-.03em; color:#e8f54d; }
#verdict { font-family:'Barlow Condensed',sans-serif; font-size:26px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; }
#verdict.good { color:#72d472; }
#verdict.bad  { color:#e06060; }
#tips { font-family:'Barlow Condensed',sans-serif; font-size:20px; color:#7a9a7a; line-height:1.35; }
#reset-btn {
  font-family:'Barlow Condensed',sans-serif; font-size:22px; font-weight:700;
  background:#1c2e1c; color:#7a9a7a; border:2px solid #2c422c;
  border-radius:6px; padding:10px 0; cursor:pointer; width:100%;
  -webkit-tap-highlight-color:transparent;
}
</style>

<div id="cam-wrap">
  <video id="video" autoplay playsinline muted></video>
  <canvas id="overlay"></canvas>
  <div id="cam-start">
    <h2>Gimme Check</h2>
    <p>Press <span style="color:#e8f54d">near the hole</span>, then press <span style="color:#72d472">near the ball</span>. The app finds and measures each automatically.</p>
    <button id="btn-start">Start Camera</button>
  </div>
  <div id="cam-denied">
    <h2>Camera blocked</h2>
    <p>Tap the lock icon in the address bar, set Camera to Allow, then reload.</p>
    <button onclick="location.reload()">Reload</button>
  </div>
</div>

<div id="panel">
  <div>
    <div style="font-family:'Barlow Condensed',sans-serif;font-size:16px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:#7a9a7a;margin-bottom:6px;">Gimme distance</div>
    <div id="gimme-row">
      <button class="gimme-btn" data-in="12">12"</button>
      <button class="gimme-btn" data-in="18">18"</button>
      <button class="gimme-btn active" data-in="24">24"</button>
      <button class="gimme-btn" data-in="36">36"</button>
    </div>
  </div>
  <div id="status-text">Start camera to begin</div>
  <div id="distance-row">
    <div id="distance">—</div>
    <div id="verdict"></div>
  </div>
  <div id="tips"></div>
  <button id="reset-btn">Measure Again</button>
</div>

<script>
const HOLE_DIA_IN = 4.25;

const video     = document.getElementById('video');
const overlay   = document.getElementById('overlay');
const ctx       = overlay.getContext('2d');
const statusTxt = document.getElementById('status-text');
const distEl    = document.getElementById('distance');
const verdEl    = document.getElementById('verdict');
const tips      = document.getElementById('tips');

let gimmeIn = 24, running = false;
let state = 'hole'; // 'hole' | 'ball' | 'done'
let hole = null, ball = null; // { x, y, r } screen coords

// ── Offscreen canvas ──────────────────────────────────────────────────────
const OW = 320, OH = 240;
const off = document.createElement('canvas');
off.width = OW; off.height = OH;
const offCtx = off.getContext('2d', { willReadFrequently: true });

function getVideoCrop() {
  const vW = video.videoWidth, vH = video.videoHeight;
  const dW = overlay.width,    dH = overlay.height;
  if (!vW || !dW) return { sx:0, sy:0, sw:vW||1, sh:vH||1 };
  const vAR = vW/vH, dAR = dW/dH;
  let sx, sy, sw, sh;
  if (vAR > dAR) { sh=vH; sw=vH*dAR; sx=(vW-sw)/2; sy=0; }
  else           { sw=vW; sh=vW/dAR; sx=0; sy=(vH-sh)/2; }
  return { sx, sy, sw, sh };
}

function captureFrame() {
  const { sx, sy, sw, sh } = getVideoCrop();
  offCtx.drawImage(video, sx, sy, sw, sh, 0, 0, OW, OH);
  return offCtx.getImageData(0, 0, OW, OH).data;
}

// ── Ray detection: measure circular boundary from a seed point ────────────
function detectAt(data, ox, oy, maxR) {
  const cx = Math.round(ox), cy = Math.round(oy);
  let cr=0, cg=0, cb=0, cn=0;
  for (let dy=-1; dy<=1; dy++) for (let dx=-1; dx<=1; dx++) {
    const nx=cx+dx, ny=cy+dy;
    if (nx<0||nx>=OW||ny<0||ny>=OH) continue;
    const i=(ny*OW+nx)*4;
    cr+=data[i]; cg+=data[i+1]; cb+=data[i+2]; cn++;
  }
  if (!cn) return null;
  cr/=cn; cg/=cn; cb/=cn;

  const RAYS = 20;
  const radii = [];
  for (let i=0; i<RAYS; i++) {
    const angle = (i/RAYS)*Math.PI*2;
    const dx = Math.cos(angle), dy = Math.sin(angle);
    let edgeD = maxR;
    for (let d=1.5; d<=maxR; d+=0.5) {
      const nx=Math.round(ox+dx*d), ny=Math.round(oy+dy*d);
      if (nx<0||nx>=OW||ny<0||ny>=OH) { edgeD=d; break; }
      const idx=(ny*OW+nx)*4;
      const dist=Math.sqrt((data[idx]-cr)**2+(data[idx+1]-cg)**2+(data[idx+2]-cb)**2);
      if (dist>42) { edgeD=d; break; }
    }
    radii.push(edgeD);
  }

  const sorted = [...radii].sort((a,b)=>a-b);
  const medR = sorted[Math.floor(RAYS/2)];
  const mean = radii.reduce((s,v)=>s+v,0)/RAYS;
  const variance = radii.reduce((s,v)=>s+(v-mean)**2,0)/RAYS;
  // Score: high median radius + low variance = large circular object
  const score = medR > 1.5 ? medR / (1 + variance) : 0;

  return { cx:ox, cy:oy, r:medR, score };
}

// ── Find best circular object near a screen tap ───────────────────────────
// searchRadiusPx: how far from tap (in screen pixels) to search
// Returns { x, y, r } in screen coords, or null
function findNear(screenX, screenY, searchRadiusPx, maxRadiusPx) {
  const data = captureFrame();

  // Map screen → offscreen
  const ox0 = (screenX / overlay.width)  * OW;
  const oy0 = (screenY / overlay.height) * OH;
  const searchOff = (searchRadiusPx / overlay.width) * OW;
  const maxROff   = (maxRadiusPx    / overlay.width) * OW;

  const STEP = Math.max(1.5, searchOff / 6);
  let best = null;

  for (let dy = -searchOff; dy <= searchOff; dy += STEP) {
    for (let dx = -searchOff; dx <= searchOff; dx += STEP) {
      if (Math.hypot(dx, dy) > searchOff) continue;
      const ox = ox0+dx, oy = oy0+dy;
      if (ox<1||ox>=OW-1||oy<1||oy>=OH-1) continue;
      const res = detectAt(data, ox, oy, maxROff);
      if (res && (!best || res.score > best.score)) best = res;
    }
  }

  if (!best || best.r < 1.5) return null;

  // Convert back to screen coords
  const sx = (best.cx / OW) * overlay.width;
  const sy = (best.cy / OH) * overlay.height;
  const sr = (best.r  / OW) * overlay.width;
  return { x:sx, y:sy, r:sr };
}

// ── Handle tap ────────────────────────────────────────────────────────────
function handleTap(screenX, screenY) {
  if (!running || state === 'done') return;

  // Ripple feedback
  const ripple = document.createElement('div');
  ripple.className = 'ripple';
  ripple.style.color = state === 'hole' ? '#e8f54d' : '#72d472';
  ripple.style.left = screenX+'px'; ripple.style.top = screenY+'px';
  overlay.parentElement.appendChild(ripple);
  setTimeout(()=>ripple.remove(), 520);

  if (state === 'hole') {
    // Hole: search a medium radius, expect a larger object
    const found = findNear(screenX, screenY,
      overlay.width * 0.22,   // search radius: ~22% of screen width
      overlay.width * 0.35);  // max object radius
    hole = found || { x:screenX, y:screenY, r:overlay.width*0.12 };
    state = 'ball';
    statusTxt.textContent = 'Now press near the ball';
    tips.textContent = 'Press anywhere close to the ball';

  } else {
    // Ball: search wider, expect a smaller object
    const found = findNear(screenX, screenY,
      overlay.width * 0.28,   // search wider since ball is small
      overlay.width * 0.18);  // max object radius (ball is smaller than hole)
    ball = found || { x:screenX, y:screenY, r:overlay.width*0.06 };
    state = 'done';
    showResult();
  }
  redraw();
}

// ── Result ────────────────────────────────────────────────────────────────
function showResult() {
  const pxPerIn  = (hole.r * 2) / HOLE_DIA_IN;
  const centerPx = Math.hypot(ball.x - hole.x, ball.y - hole.y);
  const edgePx   = Math.max(0, centerPx - hole.r - ball.r);
  const inches   = edgePx / pxPerIn;
  distEl.textContent = inches.toFixed(1) + ' in';
  const isGimme = inches <= gimmeIn;
  verdEl.textContent = isGimme ? 'Gimme ✓' : 'Putt it';
  verdEl.className   = isGimme ? 'good' : 'bad';
  statusTxt.textContent = `${inches.toFixed(1)}" from hole`;
  tips.textContent = 'Press Measure Again for next putt';
}

// ── Draw ──────────────────────────────────────────────────────────────────
function drawRing(obj, color, label) {
  ctx.beginPath(); ctx.arc(obj.x, obj.y, obj.r+5, 0, Math.PI*2);
  ctx.strokeStyle = color+'45'; ctx.lineWidth=10; ctx.stroke();

  ctx.beginPath(); ctx.arc(obj.x, obj.y, obj.r, 0, Math.PI*2);
  ctx.strokeStyle = color; ctx.lineWidth=3.5; ctx.stroke();

  ctx.strokeStyle=color; ctx.lineWidth=2;
  ctx.beginPath();
  ctx.moveTo(obj.x-12,obj.y); ctx.lineTo(obj.x+12,obj.y);
  ctx.moveTo(obj.x,obj.y-12); ctx.lineTo(obj.x,obj.y+12);
  ctx.stroke();

  ctx.font='bold 14px "DM Mono",monospace';
  ctx.textAlign='center'; ctx.textBaseline='middle';
  const lw=ctx.measureText(label).width+14, ly=obj.y-obj.r-18;
  ctx.fillStyle='rgba(14,26,14,.88)';
  ctx.beginPath(); ctx.roundRect(obj.x-lw/2,ly-12,lw,24,4); ctx.fill();
  ctx.fillStyle=color; ctx.fillText(label,obj.x,ly);
}

// Crosshair hint showing where to press
function drawHint(color) {
  const cx=overlay.width/2, cy=overlay.height*0.44;
  ctx.strokeStyle=color+'66'; ctx.lineWidth=1.5; ctx.setLineDash([5,4]);
  ctx.beginPath(); ctx.moveTo(cx-24,cy); ctx.lineTo(cx+24,cy); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(cx,cy-24); ctx.lineTo(cx,cy+24); ctx.stroke();
  ctx.setLineDash([]);
}

function redraw() {
  ctx.clearRect(0,0,overlay.width,overlay.height);
  if (!running) return;
  if (state==='hole') { drawHint('#e8f54d'); return; }
  if (hole) drawRing(hole,'#e8f54d','HOLE');
  if (state==='ball') { drawHint('#72d472'); }
  if (hole && ball) {
    ctx.beginPath(); ctx.moveTo(hole.x,hole.y); ctx.lineTo(ball.x,ball.y);
    ctx.strokeStyle='rgba(255,255,255,.3)'; ctx.lineWidth=1.5;
    ctx.setLineDash([7,5]); ctx.stroke(); ctx.setLineDash([]);
  }
  if (ball) drawRing(ball,'#72d472','BALL');
}

// ── Touch / mouse ─────────────────────────────────────────────────────────
let tStart = null;
overlay.addEventListener('touchstart', e=>{ e.preventDefault(); const t=e.changedTouches[0]; tStart={x:t.clientX,y:t.clientY}; },{passive:false});
overlay.addEventListener('touchmove',  e=>{ e.preventDefault(); if(tStart){const t=e.changedTouches[0]; if(Math.hypot(t.clientX-tStart.x,t.clientY-tStart.y)>12) tStart=null;} },{passive:false});
overlay.addEventListener('touchend',   e=>{ e.preventDefault(); if(tStart){const t=e.changedTouches[0]; handleTap(t.clientX,t.clientY);} tStart=null; },{passive:false});
overlay.addEventListener('click', e=>handleTap(e.clientX,e.clientY));

// ── Controls ──────────────────────────────────────────────────────────────
document.querySelectorAll('.gimme-btn').forEach(b=>{
  b.addEventListener('click',()=>{
    document.querySelectorAll('.gimme-btn').forEach(x=>x.classList.remove('active'));
    b.classList.add('active'); gimmeIn=parseInt(b.dataset.in);
    if(state==='done') showResult(); redraw();
  });
});

document.getElementById('reset-btn').addEventListener('click',()=>{
  state='hole'; hole=null; ball=null;
  distEl.textContent='—'; verdEl.textContent=''; verdEl.className='';
  statusTxt.textContent='Press near the hole';
  tips.textContent='Press anywhere close to the hole';
  redraw();
});

function syncCanvas() {
  const r=overlay.parentElement.getBoundingClientRect();
  overlay.width=r.width; overlay.height=r.height;
}
window.addEventListener('resize',()=>{ syncCanvas(); redraw(); });

document.getElementById('btn-start').addEventListener('click',async()=>{
  document.getElementById('cam-start').style.display='none';
  try {
    const stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:1280}}});
    video.srcObject=stream;
    video.addEventListener('loadedmetadata',()=>{
      syncCanvas(); running=true;
      statusTxt.textContent='Press near the hole';
      tips.textContent='Press anywhere close to the hole';
      redraw();
    });
  } catch { document.getElementById('cam-denied').classList.add('show'); }
});
</script>
