<title>Gimme Check</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700&family=DM+Mono:wght@400;500&display=swap">

<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
body {
  height: 100dvh; overflow: hidden;
  background: #0e1a0e; color: #dff0df;
  font-family: 'DM Mono', monospace;
  display: flex; flex-direction: column;
}
#cam-wrap { position: relative; flex: 1; min-height: 0; background: #000; overflow: hidden; }
video { width: 100%; height: 100%; object-fit: cover; display: block; }
#overlay { position: absolute; inset: 0; width: 100%; height: 100%; }

#cam-start {
  display: flex; position: absolute; inset: 0;
  flex-direction: column; align-items: center; justify-content: center;
  gap: 20px; background: #0e1a0e; padding: 32px; text-align: center;
}
#cam-start h2 { font-family: 'Barlow Condensed', sans-serif; font-size: 36px; font-weight: 700; }
#cam-start p  { font-family: 'Barlow Condensed', sans-serif; font-size: 20px; color: #7a9a7a; max-width: 280px; line-height: 1.4; }
#cam-start button {
  font-family: 'Barlow Condensed', sans-serif; font-size: 22px; font-weight: 700;
  letter-spacing: 0.07em; text-transform: uppercase;
  background: #e8f54d; color: #0e1a0e;
  border: none; border-radius: 8px; padding: 16px 40px; cursor: pointer;
}
#cam-denied { display: none; position: absolute; inset: 0; flex-direction: column; align-items: center; justify-content: center; gap: 16px; background: #0e1a0e; padding: 32px; text-align: center; }
#cam-denied.show { display: flex; }
#cam-denied h2 { font-family: 'Barlow Condensed', sans-serif; font-size: 28px; font-weight: 600; }
#cam-denied p  { font-family: 'Barlow Condensed', sans-serif; font-size: 18px; color: #7a9a7a; max-width: 280px; line-height: 1.4; }
#cam-denied button { font-family: 'Barlow Condensed', sans-serif; font-size: 18px; font-weight: 700; background: #e8f54d; color: #0e1a0e; border: none; border-radius: 6px; padding: 12px 28px; cursor: pointer; }

#panel {
  background: #0e1a0e; border-top: 2px solid #1e321e;
  padding: 14px 18px 18px; flex-shrink: 0;
  display: flex; flex-direction: column; gap: 12px;
}
#gimme-row { display: flex; gap: 8px; }
.gimme-btn {
  font-family: 'Barlow Condensed', sans-serif; font-size: 22px; font-weight: 700;
  background: #1c2e1c; color: #7a9a7a;
  border: 2px solid #2c422c; border-radius: 6px;
  padding: 8px 0; cursor: pointer; flex: 1;
  -webkit-tap-highlight-color: transparent;
}
.gimme-btn.active { background: #243824; color: #e8f54d; border-color: #e8f54d; }

#status-row { display: flex; align-items: center; gap: 10px; }
#status-dot { width: 12px; height: 12px; border-radius: 50%; background: #4a6a4a; flex-shrink: 0; }
#status-dot.searching { background: #e8a020; animation: pulse 1s ease-in-out infinite; }
#status-dot.locked    { background: #72d472; }
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }
#status-text { font-family: 'Barlow Condensed', sans-serif; font-size: 18px; color: #7a9a7a; }

#distance-row { display: flex; align-items: baseline; gap: 10px; }
#distance { font-size: 64px; font-weight: 500; line-height: 1; font-variant-numeric: tabular-nums; letter-spacing: -0.03em; color: #e8f54d; }
#verdict { font-family: 'Barlow Condensed', sans-serif; font-size: 22px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; }
#verdict.good { color: #72d472; }
#verdict.bad  { color: #e06060; }
#verdict.none { color: #4a6a4a; }
#tips { font-family: 'Barlow Condensed', sans-serif; font-size: 16px; color: #4a6a4a; line-height: 1.3; }
</style>

<div id="cam-wrap">
  <video id="video" autoplay playsinline muted></video>
  <canvas id="overlay"></canvas>
  <div id="cam-start">
    <h2>Gimme Check</h2>
    <p>Point camera at the hole and ball. Distance appears automatically.</p>
    <button id="btn-start">Start Camera</button>
  </div>
  <div id="cam-denied">
    <h2>Camera blocked</h2>
    <p>Tap the lock icon in the address bar, set Camera to Allow, then reload.</p>
    <button onclick="location.reload()">Reload</button>
  </div>
</div>

<div id="panel">
  <div>
    <div style="font-family:'Barlow Condensed',sans-serif;font-size:13px;font-weight:600;letter-spacing:0.12em;text-transform:uppercase;color:#7a9a7a;margin-bottom:6px;">Gimme distance</div>
    <div id="gimme-row">
      <button class="gimme-btn" data-in="12">12"</button>
      <button class="gimme-btn" data-in="18">18"</button>
      <button class="gimme-btn active" data-in="24">24"</button>
      <button class="gimme-btn" data-in="36">36"</button>
    </div>
  </div>
  <div id="status-row">
    <div id="status-dot"></div>
    <div id="status-text">Start camera to begin</div>
  </div>
  <div id="distance-row">
    <div id="distance">—</div>
    <div id="verdict" class="none"></div>
  </div>
  <div id="tips">Point camera down · Works with any ball color</div>
</div>

<script>
const video      = document.getElementById('video');
const overlay    = document.getElementById('overlay');
const ctx        = overlay.getContext('2d');
const statusDot  = document.getElementById('status-dot');
const statusText = document.getElementById('status-text');
const distEl     = document.getElementById('distance');
const verdEl     = document.getElementById('verdict');
const tips       = document.getElementById('tips');

const HOLE_DIA_IN = 4.25;
let gimmeIn = 24, running = false;

// Small analysis canvas — fast pixel reads
const W = 160, H = 120;
const off = document.createElement('canvas');
off.width = W; off.height = H;
const offCtx = off.getContext('2d', { willReadFrequently: true });

document.querySelectorAll('.gimme-btn').forEach(b => {
  b.addEventListener('click', () => {
    document.querySelectorAll('.gimme-btn').forEach(x => x.classList.remove('active'));
    b.classList.add('active');
    gimmeIn = parseInt(b.dataset.in);
  });
});

document.getElementById('btn-start').addEventListener('click', async () => {
  document.getElementById('cam-start').style.display = 'none';
  try {
    const stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: { ideal: 'environment' }, width: { ideal: 1280 } }
    });
    video.srcObject = stream;
    video.addEventListener('loadedmetadata', () => { syncCanvas(); running = true; loop(); });
  } catch { document.getElementById('cam-denied').classList.add('show'); }
});

window.addEventListener('resize', syncCanvas);
function syncCanvas() {
  const r = overlay.parentElement.getBoundingClientRect();
  overlay.width = r.width; overlay.height = r.height;
}

// ── Cluster: prune outliers, return centroid + area-based radius ──────────
function clusterPx(pixels, minCount, minRad, maxRadFrac) {
  if (pixels.length < minCount) return null;
  let sx=0, sy=0;
  for (const [x,y] of pixels) { sx+=x; sy+=y; }
  let cx=sx/pixels.length, cy=sy/pixels.length, pts=pixels;
  for (let i=0; i<2; i++) {
    const re = Math.sqrt(pts.length / Math.PI);
    pts = pts.filter(([x,y]) => Math.hypot(x-cx,y-cy) < re*2.5);
    if (pts.length < minCount) return null;
    sx=0; sy=0;
    for (const [x,y] of pts) { sx+=x; sy+=y; }
    cx=sx/pts.length; cy=sy/pts.length;
  }
  const rad = Math.sqrt(pts.length / Math.PI);
  if (rad < minRad || rad > W * maxRadFrac) return null;
  return { cx, cy, rad };
}

// ── Main analysis ─────────────────────────────────────────────────────────
function analyze() {
  offCtx.drawImage(video, 0, 0, W, H);
  const data = offCtx.getImageData(0, 0, W, H).data;

  // ── Pass 1: sample grass color from the majority of pixels ───────────
  // Grass is greenish (g > r, g > b) and medium brightness.
  // We collect a rough median to adapt to lighting conditions.
  let gR=0, gG=0, gB=0, gN=0;
  for (let i=0; i<data.length; i+=4) {
    const r=data[i], g=data[i+1], b=data[i+2];
    // Green-biased pixels: green channel leads, medium brightness
    if (g > r*1.05 && g > b*1.05 && g > 30 && g < 230) {
      gR+=r; gG+=g; gB+=b; gN++;
    }
  }
  // Fallback grass color if frame has too little green (sand trap, etc.)
  const grassR = gN > 100 ? gR/gN : 80;
  const grassG = gN > 100 ? gG/gN : 120;
  const grassB = gN > 100 ? gB/gN : 60;

  // ── Pass 2: classify each pixel ───────────────────────────────────────
  const holePx = [], ballPx = [];

  for (let y=0; y<H; y++) {
    for (let x=0; x<W; x++) {
      const i = (y*W+x)*4;
      const r=data[i], g=data[i+1], b=data[i+2];
      const luma = 0.299*r + 0.587*g + 0.114*b;

      // ── HOLE: nearly black, neutral (not green-tinted shadow) ────────
      // Real cup interior is very dark. Require luma < 45 so stray shadows
      // on clothing/ground don't trigger. Green-tint check excludes grass shadow.
      if (luma < 45 && (g - Math.min(r,b)) < 20) {
        holePx.push([x, y]);
      }

      // ── BALL: most different from grass, but brighter than a shadow ───
      // Color distance from grass median in RGB space.
      // Any colored ball (white, yellow, red, orange, pink) will be
      // far from green grass in color space AND brighter than the hole.
      const dr = r - grassR, dg = g - grassG, db = b - grassB;
      const colorDist = Math.sqrt(dr*dr + dg*dg + db*db);

      // Must be meaningfully different from grass AND not dark (not the hole)
      if (colorDist > 55 && luma > 80) {
        ballPx.push([x, y]);
      }
    }
  }

  const sx=overlay.width/W, sy=overlay.height/H, sc=(sx+sy)/2;
  let hole=null, ball=null;

  const hc = clusterPx(holePx, 18, 3, 0.45);
  if (hc) hole = { x: hc.cx*sx, y: hc.cy*sy, r: Math.max(8, hc.rad*sc) };

  const bc = clusterPx(ballPx, 5, 2, 0.35);
  if (bc) ball = { x: bc.cx*sx, y: bc.cy*sy, r: Math.max(10, bc.rad*sc) };

  // If hole and ball centroids are too close, they're the same object — discard ball
  if (hole && ball && Math.hypot(ball.x-hole.x, ball.y-hole.y) < hole.r * 1.5) {
    ball = null;
  }

  return { hole, ball };
}

// ── Draw helpers ──────────────────────────────────────────────────────────
function ring(cx, cy, r, col) {
  ctx.beginPath(); ctx.arc(cx,cy,r,0,Math.PI*2);
  ctx.strokeStyle=col; ctx.lineWidth=2.5; ctx.stroke();
}
function cross(cx, cy, s, col) {
  ctx.strokeStyle=col; ctx.lineWidth=2;
  ctx.beginPath();
  ctx.moveTo(cx-s,cy); ctx.lineTo(cx+s,cy);
  ctx.moveTo(cx,cy-s); ctx.lineTo(cx,cy+s);
  ctx.stroke();
}
function dashedLine(ax,ay,bx,by) {
  ctx.beginPath(); ctx.moveTo(ax,ay); ctx.lineTo(bx,by);
  ctx.strokeStyle='#72d472'; ctx.lineWidth=2.5;
  ctx.setLineDash([8,5]); ctx.stroke(); ctx.setLineDash([]);
}
function badge(txt,x,y,col) {
  ctx.font='bold 13px "DM Mono",monospace';
  ctx.textAlign='center'; ctx.textBaseline='middle';
  const w=ctx.measureText(txt).width+12;
  ctx.fillStyle='rgba(14,26,14,0.85)';
  ctx.beginPath(); ctx.roundRect(x-w/2,y-11,w,22,3); ctx.fill();
  ctx.fillStyle=col; ctx.fillText(txt,x,y);
}

// ── Render loop ───────────────────────────────────────────────────────────
let frameCount=0;
function loop() {
  if (!running) return;
  requestAnimationFrame(loop);
  if (++frameCount % 3 !== 0 || !video.videoWidth) return;

  ctx.clearRect(0,0,overlay.width,overlay.height);
  const { hole, ball } = analyze();

  if (hole) {
    ring(hole.x,hole.y,hole.r,'rgba(232,245,77,0.75)');
    cross(hole.x,hole.y,7,'#e8f54d');
    badge('HOLE',hole.x,hole.y-hole.r-14,'#e8f54d');
  }
  if (ball) {
    ring(ball.x,ball.y,ball.r,'rgba(114,212,114,0.75)');
    cross(ball.x,ball.y,6,'#72d472');
    badge('BALL',ball.x,ball.y-ball.r-14,'#72d472');
  }

  if (hole && ball) {
    const pxPerIn = (hole.r*2) / HOLE_DIA_IN;
    const inches  = Math.hypot(ball.x-hole.x, ball.y-hole.y) / pxPerIn;
    dashedLine(hole.x,hole.y,ball.x,ball.y);
    badge(inches.toFixed(1)+'"',(hole.x+ball.x)/2,(hole.y+ball.y)/2-14,'#72d472');

    distEl.textContent = inches.toFixed(1)+' in';
    verdEl.textContent = inches<=gimmeIn ? 'Gimme ✓' : 'Putt it';
    verdEl.className   = inches<=gimmeIn ? 'good' : 'bad';
    statusDot.className='locked';
    statusText.textContent='Locked on hole and ball';
    tips.style.display='none';
  } else {
    distEl.textContent='—'; verdEl.textContent=''; verdEl.className='none';
    statusDot.className='searching'; tips.style.display='';
    if (!hole&&!ball)  statusText.textContent='Looking for hole and ball…';
    else if (!hole)    statusText.textContent='Ball found — looking for hole…';
    else               statusText.textContent='Hole found — looking for ball…';
  }
}
</script>
